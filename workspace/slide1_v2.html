<!DOCTYPE html>
<html>
<head>
<style>
html { background: #000000; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: linear-gradient(135deg, #0A0E1A 0%, #1a1a2e 100%);
  font-family: Arial, sans-serif;
  display: flex;
  position: relative;
  overflow: hidden;
}
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 30px,
    rgba(177, 101, 251, 0.03) 30px,
    rgba(177, 101, 251, 0.03) 60px
  );
  z-index: 0;
}
.container {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60pt;
}
.badge {
  background: rgba(177, 101, 251, 0.2);
  border: 2px solid #B165FB;
  color: #B165FB;
  padding: 10pt 24pt;
  border-radius: 25pt;
  font-size: 16pt;
  font-weight: bold;
  margin-bottom: 30pt;
  text-transform: uppercase;
  letter-spacing: 1pt;
}
h1 {
  color: #FFFFFF;
  font-size: 56pt;
  font-weight: 900;
  margin: 0 0 20pt 0;
  text-align: center;
  line-height: 1.2;
  text-shadow: 0 4px 12px rgba(177, 101, 251, 0.5);
}
.subtitle {
  color: #40695B;
  font-size: 22pt;
  font-weight: 600;
  margin: 0 0 30pt 0;
  text-align: center;
  line-height: 1.4;
}
.date {
  color: rgba(255, 255, 255, 0.6);
  font-size: 18pt;
  margin: 0;
  text-align: center;
}
.accent-line {
  width: 200pt;
  height: 4pt;
  background: linear-gradient(90deg, #B165FB, #40695B);
  margin: 30pt auto 20pt auto;
  border-radius: 2pt;
}
</style>
</head>
<body>
<div class="container">
  <p class="badge">🔮 2026 AI Infrastructure</p>
  <h1>AIエージェント・ハーネス</h1>
  <p class="subtitle">信頼性を支える次世代OS</p>
  <div class="accent-line"></div>
  <p class="date">2026年1月6日</p>
</div>
</body>
</html>
