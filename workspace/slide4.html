<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex;
}
.container {
  width: 100%;
  height: 100%;
  position: relative;
}
.accent-bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 8pt;
  background: #40695B;
}
.header {
  margin-left: 50pt;
  margin-top: 40pt;
  margin-right: 50pt;
}
h2 {
  color: #181B24;
  font-size: 36pt;
  font-weight: bold;
  margin: 0;
}
.content-area {
  margin-left: 50pt;
  margin-right: 50pt;
  margin-top: 30pt;
  display: flex;
  gap: 30pt;
}
.text-column {
  flex: 1;
}
.text-column p {
  color: #181B24;
  font-size: 16pt;
  line-height: 1.6;
  margin: 0 0 15pt 0;
}
.stats-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20pt;
}
.stat-box {
  background: #B165FB;
  padding: 20pt;
  border-radius: 10pt;
  text-align: center;
}
.stat-box p {
  margin: 0;
}
.stat-number {
  color: #FFFFFF;
  font-size: 42pt;
  font-weight: bold;
}
.stat-label {
  color: #FFFFFF;
  font-size: 14pt;
  margin-top: 5pt;
}
</style>
</head>
<body>
<div class="container">
  <div class="accent-bar"></div>
  <div class="header">
    <h2>データ資産としての価値</h2>
  </div>
  <div class="content-area">
    <div class="text-column">
      <p>ハーネスによって収集された<b>実行ログ</b>や<b>失敗の軌跡</b>は、次世代モデルの精度を向上させるための貴重なデータセットとして機能します。</p>
      <p>これらのデータは、AIシステムの継続的な改善サイクルを可能にし、より高度な自律性を実現します。</p>
    </div>
    <div class="stats-column">
      <div class="stat-box">
        <p class="stat-number">∞</p>
        <p class="stat-label">学習データの蓄積</p>
      </div>
      <div class="stat-box">
        <p class="stat-number">↑</p>
        <p class="stat-label">精度の継続的向上</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
