<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF;
  font-family: Arial, sans-serif;
  display: flex;
}
.container {
  width: 100%;
  height: 100%;
  display: flex;
}
.left-panel {
  width: 50%;
  background: linear-gradient(135deg, #B165FB 0%, #8B4FD9 100%);
  padding: 50pt;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
}
.left-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 20px,
    rgba(255, 255, 255, 0.05) 20px,
    rgba(255, 255, 255, 0.05) 40px
  );
}
.left-content {
  position: relative;
  z-index: 1;
}
.icon {
  font-size: 64pt;
  margin-bottom: 30pt;
  filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
}
h2 {
  color: #FFFFFF;
  font-size: 42pt;
  font-weight: 900;
  margin: 0 0 20pt 0;
  line-height: 1.2;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}
.tagline {
  color: rgba(255, 255, 255, 0.95);
  font-size: 18pt;
  font-weight: 600;
  margin: 0;
  line-height: 1.6;
}
.right-panel {
  width: 50%;
  padding: 50pt;
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.analogy {
  background: #F8F9FA;
  border-left: 6pt solid #B165FB;
  padding: 25pt;
  border-radius: 8pt;
  margin-bottom: 25pt;
}
.analogy-title {
  color: #B165FB;
  font-size: 16pt;
  font-weight: bold;
  margin: 0 0 12pt 0;
  text-transform: uppercase;
  letter-spacing: 0.5pt;
}
.analogy-item {
  color: #181B24;
  font-size: 18pt;
  margin: 8pt 0;
  line-height: 1.5;
}
.analogy-item strong {
  color: #B165FB;
  font-weight: 900;
}
.description {
  color: #5a6c7d;
  font-size: 16pt;
  line-height: 1.7;
  margin: 0;
}
</style>
</head>
<body>
<div class="container">
  <div class="left-panel">
    <div class="left-content">
      <p class="icon">🏗️</p>
      <h2>ハーネスとは<br/>何か</h2>
      <p class="tagline">AIシステムを統括する<br/>次世代インフラストラクチャ</p>
    </div>
  </div>
  <div class="right-panel">
    <div class="analogy">
      <p class="analogy-title">システムの比喩</p>
      <p class="analogy-item"><strong>AIモデル</strong> = CPU（処理装置）</p>
      <p class="analogy-item"><strong>コンテキスト</strong> = メモリ（記憶装置）</p>
      <p class="analogy-item"><strong>ハーネス</strong> = OS（統括システム）</p>
    </div>
    <p class="description">長期にわたる複雑なタスクの安定性を支える役割を果たし、従来のベンチマークでは測れない持続的な信頼性を確保します。</p>
  </div>
</div>
</body>
</html>
