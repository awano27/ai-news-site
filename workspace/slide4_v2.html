<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF;
  font-family: Arial, sans-serif;
  display: flex;
}
.container {
  width: 100%;
  height: 100%;
  display: flex;
}
.left-panel {
  width: 55%;
  padding: 50pt;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
h2 {
  color: #181B24;
  font-size: 38pt;
  font-weight: 900;
  margin: 0 0 25pt 0;
  line-height: 1.2;
}
h2 span {
  color: #40695B;
  display: block;
  font-size: 32pt;
  margin-top: 10pt;
}
.description {
  color: #5a6c7d;
  font-size: 17pt;
  line-height: 1.8;
  margin: 0 0 30pt 0;
}
.highlight {
  background: linear-gradient(135deg, #f3ebff 0%, #e8f5f1 100%);
  border-left: 5pt solid #B165FB;
  padding: 20pt;
  border-radius: 8pt;
}
.highlight p {
  color: #181B24;
  font-size: 16pt;
  font-weight: 600;
  margin: 0;
  line-height: 1.6;
}
.right-panel {
  width: 45%;
  background: linear-gradient(135deg, #40695B 0%, #2d4d42 100%);
  padding: 50pt;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}
.right-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    135deg,
    transparent,
    transparent 25px,
    rgba(255, 255, 255, 0.05) 25px,
    rgba(255, 255, 255, 0.05) 50px
  );
}
.stat-container {
  position: relative;
  z-index: 1;
  text-align: center;
}
.stat-icon {
  font-size: 80pt;
  margin-bottom: 20pt;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
}
.stat-label {
  color: #FFFFFF;
  font-size: 24pt;
  font-weight: bold;
  margin: 0;
  line-height: 1.4;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}
</style>
</head>
<body>
<div class="container">
  <div class="left-panel">
    <h2>データ資産としての<span>価値</span></h2>
    <p class="description">ハーネスによって収集された実行ログや失敗の軌跡は、次世代モデルの精度を向上させるための貴重なデータセットとして機能します。</p>
    <div class="highlight">
      <p>これらのデータは、AIシステムの継続的な改善サイクルを可能にし、より高度な自律性を実現します。</p>
    </div>
  </div>
  <div class="right-panel">
    <div class="stat-container">
      <p class="stat-icon">📊</p>
      <p class="stat-label">実行ログ<br/>+<br/>失敗の軌跡<br/>=<br/>学習データ</p>
    </div>
  </div>
</div>
</body>
</html>
