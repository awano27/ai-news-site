<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex;
}
.container {
  width: 100%;
  height: 100%;
  position: relative;
}
.accent-bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 8pt;
  background: #B165FB;
}
.header {
  margin-left: 50pt;
  margin-top: 40pt;
  margin-right: 50pt;
}
h2 {
  color: #181B24;
  font-size: 36pt;
  font-weight: bold;
  margin: 0;
}
.content-area {
  margin-left: 50pt;
  margin-right: 50pt;
  margin-top: 30pt;
}
.content-area ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
.content-area li {
  color: #181B24;
  font-size: 18pt;
  line-height: 1.8;
  margin-bottom: 20pt;
  padding-left: 40pt;
  position: relative;
}
.content-area li:before {
  content: "▸";
  color: #B165FB;
  font-size: 24pt;
  position: absolute;
  left: 0;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="container">
  <div class="accent-bar"></div>
  <div class="header">
    <h2>コンテキスト・エンジニアリングの重要性</h2>
  </div>
  <div class="content-area">
    <ul>
      <li>持続的な指示への<b>忠実度</b>を確保</li>
      <li>長期タスクにおける<b>信頼性</b>の向上</li>
      <li>過剰な制御フローを避けた<b>柔軟な設計</b></li>
      <li>モデルの進化に合わせて<b>コードを破棄</b>できる構造</li>
    </ul>
  </div>
</div>
</body>
</html>
