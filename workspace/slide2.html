<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex;
}
.container {
  width: 100%;
  height: 100%;
  position: relative;
}
.accent-bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 8pt;
  background: #B165FB;
}
.header {
  margin-left: 50pt;
  margin-top: 40pt;
  margin-right: 50pt;
}
h2 {
  color: #181B24;
  font-size: 36pt;
  font-weight: bold;
  margin: 0;
}
.content-area {
  display: flex;
  margin-left: 50pt;
  margin-right: 50pt;
  margin-top: 30pt;
  gap: 30pt;
}
.text-column {
  flex: 1;
}
.text-column p {
  color: #181B24;
  font-size: 16pt;
  line-height: 1.6;
  margin: 0 0 15pt 0;
}
.image-column {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.highlight-box {
  background: #40695B;
  padding: 25pt;
  border-radius: 12pt;
}
.highlight-box p {
  color: #FFFFFF;
  font-size: 20pt;
  font-weight: bold;
  text-align: center;
  margin: 0;
}
</style>
</head>
<body>
<div class="container">
  <div class="accent-bar"></div>
  <div class="header">
    <h2>ハーネスとは何か</h2>
  </div>
  <div class="content-area">
    <div class="text-column">
      <p>AIモデルをCPU、コンテキストをメモリとするならば、エージェント・ハーネスはシステム全体を統括する<b>オペレーティングシステム（OS）</b>に相当します。</p>
      <p>長期にわたる複雑なタスクの安定性を支える役割を果たし、従来のベンチマークでは測れない持続的な信頼性を確保します。</p>
    </div>
    <div class="image-column">
      <div class="highlight-box">
        <p>AI System OS<br/>= Agent Harness</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
