<!DOCTYPE html>
<html>
<head>
<style>
html { background: #181B24; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #181B24; font-family: Arial, sans-serif;
  display: flex;
}
.container {
  width: 100%;
  height: 100%;
  position: relative;
}
.accent-bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 8pt;
  background: #B165FB;
}
.content {
  margin-left: 50pt;
  margin-top: 80pt;
  margin-right: 50pt;
}
h1 {
  color: #FFFFFF;
  font-size: 52pt;
  font-weight: bold;
  margin: 0 0 30pt 0;
  line-height: 1.2;
}
.subtitle {
  color: #40695B;
  font-size: 24pt;
  font-weight: bold;
  margin: 0;
}
.date {
  color: #B165FB;
  font-size: 18pt;
  margin: 20pt 0 0 0;
}
</style>
</head>
<body>
<div class="container">
  <div class="accent-bar"></div>
  <div class="content">
    <h1>AIエージェント・ハーネス</h1>
    <p class="subtitle">信頼性を支える次世代OS</p>
    <p class="date">2026-01-06</p>
  </div>
</div>
</body>
</html>
