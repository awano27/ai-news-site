<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
  font-family: Arial, sans-serif;
  display: flex;
  padding: 50pt;
}
.container {
  width: 100%;
  display: flex;
  flex-direction: column;
}
.header {
  margin-bottom: 35pt;
}
h2 {
  color: #181B24;
  font-size: 38pt;
  font-weight: 900;
  margin: 0 0 15pt 0;
  border-bottom: 4pt solid #B165FB;
  padding-bottom: 15pt;
}
.subtitle-text {
  color: #40695B;
  font-size: 18pt;
  font-weight: 600;
  margin: 0;
}
.grid {
  display: flex;
  gap: 20pt;
  flex: 1;
}
.card {
  flex: 1;
  background: #FFFFFF;
  border-radius: 12pt;
  padding: 25pt;
  box-shadow: 0 4pt 16pt rgba(0, 0, 0, 0.08);
  border-top: 5pt solid #B165FB;
  display: flex;
  flex-direction: column;
}
.card-icon {
  font-size: 48pt;
  margin-bottom: 15pt;
}
.card-title {
  color: #181B24;
  font-size: 18pt;
  font-weight: bold;
  margin: 0 0 12pt 0;
  line-height: 1.3;
}
.card-desc {
  color: #5a6c7d;
  font-size: 14pt;
  line-height: 1.6;
  margin: 0;
  flex: 1;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>コンテキスト・エンジニアリング</h2>
    <p class="subtitle-text">持続的な信頼性を実現する4つの重要ポイント</p>
  </div>
  <div class="grid">
    <div class="card">
      <p class="card-icon">🎯</p>
      <p class="card-title">持続的な<br/>忠実度</p>
      <p class="card-desc">指示への忠実度を長期間維持</p>
    </div>
    <div class="card">
      <p class="card-icon">🛡️</p>
      <p class="card-title">信頼性<br/>の向上</p>
      <p class="card-desc">長期タスクでの安定性確保</p>
    </div>
    <div class="card">
      <p class="card-icon">🎨</p>
      <p class="card-title">柔軟な<br/>設計</p>
      <p class="card-desc">過剰な制御フローを回避</p>
    </div>
    <div class="card">
      <p class="card-icon">♻️</p>
      <p class="card-title">進化への<br/>対応</p>
      <p class="card-desc">コードを破棄できる構造</p>
    </div>
  </div>
</div>
</body>
</html>
