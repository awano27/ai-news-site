<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0A0E1A; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: linear-gradient(135deg, #0A0E1A 0%, #1a1a2e 100%);
  font-family: Arial, sans-serif;
  display: flex;
  position: relative;
  overflow: hidden;
}
body::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 40px,
    rgba(177, 101, 251, 0.05) 40px,
    rgba(177, 101, 251, 0.05) 80px
  );
  animation: slide 30s linear infinite;
}
@keyframes slide {
  from { transform: translate(0, 0); }
  to { transform: translate(50px, 50px); }
}
.container {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60pt;
  text-align: center;
}
.year {
  color: #B165FB;
  font-size: 72pt;
  font-weight: 900;
  margin: 0 0 25pt 0;
  text-shadow: 0 0 30px rgba(177, 101, 251, 0.6);
  letter-spacing: 2pt;
}
h2 {
  color: #FFFFFF;
  font-size: 42pt;
  font-weight: 900;
  margin: 0 0 30pt 0;
  line-height: 1.3;
  text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
}
.divider {
  width: 250pt;
  height: 4pt;
  background: linear-gradient(90deg, transparent, #B165FB, #40695B, transparent);
  margin: 30pt auto;
  border-radius: 2pt;
}
.tagline {
  color: #40695B;
  font-size: 24pt;
  font-weight: 700;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 2pt;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}
.footer-text {
  position: absolute;
  bottom: 40pt;
  color: rgba(255, 255, 255, 0.4);
  font-size: 14pt;
  margin: 0;
}
</style>
</head>
<body>
<div class="container">
  <p class="year">2026</p>
  <h2>モデル性能を超えた<br/>インフラが勝負を決める</h2>
  <div class="divider"></div>
  <p class="tagline">Agent Harness Era</p>
  <p class="footer-text">AI Agent Harness - The Next Generation OS</p>
</div>
</body>
</html>
