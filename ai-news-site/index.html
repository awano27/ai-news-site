<!DOCTYPE html>
<!--
  Legacy path redirect: /ai-news-site/* → /
  ----------------------------------------
  The old GitHub Pages URL was https://awano27.github.io/ai-news-site/,
  and some external backlinks still include the /ai-news-site/ prefix
  after the custom-domain migration to visionhub.jp.
  This page issues both an HTTP equivalent (meta refresh) and a
  JavaScript redirect that preserves the hash fragment + trailing path.
-->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>リダイレクト中 | AI Intelligence Hub</title>
  <link rel="canonical" href="https://visionhub.jp/" />
  <meta name="robots" content="noindex,follow" />
  <meta http-equiv="refresh" content="0; url=/" />
  <style>
    body{font-family:"Inter","Noto Sans JP",system-ui,sans-serif;background:#070F26;color:#EDF2FF;
      display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:24px}
    a{color:#5EE7DF}
    .box{max-width:480px}
    .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.15);border-top-color:#FFCC00;
      border-radius:50%;animation:s 1s linear infinite;margin:0 auto 18px}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
  <script>
  (function () {
    // Preserve hash + deeper path (e.g. /ai-news-site/foo → /foo)
    var rest = location.pathname.replace(/^\/ai-news-site\/?/, '/');
    if (!rest.startsWith('/')) rest = '/' + rest;
    location.replace(rest + (location.search || '') + (location.hash || ''));
  })();
  </script>
</head>
<body>
  <div class="box">
    <div class="spinner" aria-hidden="true"></div>
    <h1 style="margin:0 0 10px">リダイレクトしています…</h1>
    <p style="color:#8A9ABF;margin:0 0 18px">
      サイトは <a href="https://visionhub.jp/">visionhub.jp</a> に引っ越しました。
      自動で移動しない場合は上のリンクをクリックしてください。
    </p>
    <p style="font-size:13px;color:#6e7a8d">
      古い URL: <code>awano27.github.io/ai-news-site</code> ／
      新しい URL: <code>visionhub.jp</code>
    </p>
  </div>
</body>
</html>
