<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レポート（ランキング）</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f172a;
      --accent: #3b82f6;
      --light: #f8fafc;
      --border: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      color: var(--text-primary);
      background: white;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .header {
      background: linear-gradient(135deg, var(--primary), #1e293b);
      color: white;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .header h1 { font-size: 1.4rem; margin: 0 0 6px; }
    .muted { color: #cbd5e1; font-size: 0.9rem; }
    .usage {
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0 20px;
    }
    .usage h2 { font-size: 1rem; margin: 0 0 10px; color: var(--primary); }
    .usage p { margin: 0; color: var(--text-secondary); }
    .toolbar { display: flex; align-items: center; gap: 8px; margin: 8px 0 12px; }
    .btn { padding: 8px 12px; border: 1px solid var(--border); background: white; color: var(--text-secondary); border-radius: 8px; cursor: pointer; font-size: 0.9rem; text-decoration: none; }
    .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .pane { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: white; }
    iframe { width: 100%; height: calc(100vh - 240px); border: 0; background: white; }
    @media (max-width: 1024px) { iframe { height: calc(100vh - 260px); } }
    .note { font-size: 0.85rem; color: var(--text-secondary); margin-top: 6px; }
  </style>
  <script>
    function reloadFrame() {
      const el = document.getElementById('rankFrame');
      el.src = el.src;
    }
  </script>
  <meta name="robots" content="noindex" />
  <!-- Simplified: single ranking report view with optional link to full detail page. -->
  </head>
<body>
  <div class="container">
    <div class="header">
      <h1>レポート（ランキング）</h1>
      <div class="muted">過去30日の主要技術を簡潔に俯瞰するサマリー</div>
    </div>

    <div class="usage">
      <h2>見方</h2>
      <p>エンジニア活用度 × ビジネス効率の二軸でスコア化した「優先順位付きリスト」を表示します。深掘りは下の「詳細レポート」ボタンから別ページで確認できます。</p>
      <div class="note">このページは読みやすさのため、ランキングのみを表示します。</div>
    </div>

    <div class="toolbar">
      <a class="btn" href="ai_news_detail_latest.html" target="_blank" rel="noopener">📰 詳細レポート（別ページ）</a>
      <button class="btn primary" onclick="reloadFrame()">🔄 再読込</button>
    </div>

    <div class="pane">
      <iframe id="rankFrame" src="ai_ranking_report_latest.html" title="ランキングレポート"></iframe>
    </div>

  </div>
</body>
</html>
