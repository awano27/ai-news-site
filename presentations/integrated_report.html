<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>レポート（ランキング）</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root{--primary:#0f172a;--accent:#3b82f6;--border:#e2e8f0;--light:#f8fafc;--muted:#64748b}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:#0f172a;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    .hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:14px}
    .hero h1{margin:0 0 6px 0;font-size:20px}
    .muted{color:#cbd5e1}
    .toolbar{display:flex;gap:8px;margin:12px 0}
    .btn{appearance:none;border:1px solid var(--border);background:#fff;color:#0f172a;border-radius:8px;padding:8px 12px;text-decoration:none;font-weight:600}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .pane{border:1px solid var(--border);border-radius:12px;overflow:hidden}
    iframe{width:100%;height:calc(100vh - 220px);border:0;background:#fff}
  </style>
  <script>
    function reloadFrame(){
      const el=document.getElementById('rankFrame');
      const base='ai_ranking_report_latest.html';
      const u=new URL(base, location.href); u.searchParams.set('v', Date.now().toString());
      el.src=u.pathname+u.search;
    }
    document.addEventListener('DOMContentLoaded', reloadFrame);
  </script>
  <script src="assets/xai-init.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>レポート（ランキング）</h1>
      <div class="muted">ランキングの最新ビューを下の枠で表示します。</div>
    </div>
    <div class="toolbar">
      <a class="btn" href="ai_news_detail_latest.html" target="_blank" rel="noopener">詳細レポート（別タブ）</a>
      <button class="btn primary" onclick="reloadFrame()">再読込</button>
    </div>
    <div class="pane">
      <iframe id="rankFrame" title="ランキング"></iframe>
    </div>
  </div>
</body>
</html>
