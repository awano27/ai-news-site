    :root {

      --accent: #3b82f6;
      --light: #f8fafc;
      --border: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      color: var(--text-primary);
      background: white;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .header {
      background: linear-gradient(135deg, var(--primary), #1e293b);
      color: white;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .header h1 { font-size: 1.4rem; margin: 0 0 6px; }
    .muted { color: #cbd5e1; font-size: 0.9rem; }
    .usage {
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0 20px;
    }
    .usage h2 { font-size: 1rem; margin: 0 0 10px; color: var(--primary); }
    .usage p { margin: 0; color: var(--text-secondary); }
    .toolbar { display: flex; align-items: center; gap: 8px; margin: 8px 0 12px; }
    .btn { padding: 8px 12px; border: 1px solid var(--border); background: white; color: var(--text-secondary); border-radius: 8px; cursor: pointer; font-size: 0.9rem; text-decoration: none; }
    .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .pane { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: white; }
    iframe { width: 100%; height: calc(100vh - 240px); border: 0; background: white; }
    @media (max-width: 1024px) { iframe { height: calc(100vh - 260px); } }
    .note { font-size: 0.85rem; color: var(--text-secondary); margin-top: 6px; }
  </style>
  <script>
    function reloadFrame() {
      const el = document.getElementById('rankFrame');
      const u = new URL(el.getAttribute('data-src') || el.src, location.href);
      u.searchParams.set('v', Date.now().toString());
      el.src = u.pathname + u.search;
    }
    // Cache-bust initial load so Pages/CDN螟画峩縺悟叉蜿肴丐縺輔ｌ繧・    document.addEventListener('DOMContentLoaded', () => {
      const el = document.getElementById('rankFrame');
      if (el) {
        const base = 'ai_ranking_report_latest.html';
        el.setAttribute('data-src', base);
        const u = new URL(base, location.href);
        u.searchParams.set('v', Date.now().toString());
        el.src = u.pathname + u.search;
      }
      // also cache-bust detail link
      const a = document.querySelector('a.btn[href^="ai_news_detail_latest.html"]');
      if (a) {
        const u = new URL(a.getAttribute('href'), location.href);
        u.searchParams.set('v', Date.now().toString());
        a.setAttribute('href', u.pathname + u.search);
      }
    });
  </script>
  <meta name="robots" content="noindex" />
  <!-- Simplified: single ranking report view with optional link to full detail page. -->
  <script src="assets/xai-init.js" defer></script>
