<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIニュース詳細</title>
  <style>
    :root { --bg:#0b0f14; --surface:#10161d; --text:#e6edf3; --muted:#8aa0b2; --border:#1b2530; --accent:#67e8f9; }
    * { box-sizing:border-box }
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP',sans-serif}
    .mast{background:linear-gradient(180deg,#0b0f14 0%,#0a0e13 100%);color:#dbe5ec;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;backdrop-filter:blur(6px)}
    .mast .inner{max-width:1100px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
    .mast .brand{font-weight:900;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
    .mast .nav a{color:var(--accent);text-decoration:none;margin-left:16px;font-weight:800;font-size:13px}
    .wrap{max-width:1100px;margin:0 auto;padding:0 16px 28px}
    .header{padding:22px 0 10px;border-bottom:1px solid var(--border)}
    h1{margin:12px 0 6px;font-size:24px;font-weight:900}
    .meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:6px 0 10px}
    .score{display:inline-block;background:var(--accent);color:#0b0f14;font-weight:900;border-radius:9999px;padding:4px 10px}
    .content{display:grid;grid-template-columns:1fr;gap:14px;margin-top:12px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
    .card h2{font-size:18px;margin:0 0 8px}
    .points li{margin-left:1em}
    .actions a{appearance:none;border:1px solid var(--border);background:var(--surface);padding:8px 10px;border-radius:10px;color:var(--accent);font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-right:8px}
  </style>
</head>
<body>
  <header class="mast">
    <div class="inner">
      <div class="brand">Daily AI News</div>
      <nav class="nav"><a href="./">Presentations</a><a href="ai_news_list.html">Archive</a></nav>
    </div>
  </header>
  <div class="wrap">
    <div class="header">
      <h1 id="title">AIニュース詳細</h1>
      <div class="meta"><span id="date"></span><span id="rank"></span><span class="score" id="score"></span></div>
      <div class="actions"><a id="ext" href="#" target="_blank" rel="noopener">記事を開く</a><a href="ai_news_list.html">一覧へ戻る</a></div>
    </div>
    <div class="content">
      <section class="card">
        <h2>概要</h2>
        <div id="summary">読み込み中…</div>
      </section>
      <section class="card">
        <h2>ポイント</h2>
        <ul id="points" class="points"></ul>
      </section>
      <section class="card">
        <h2>出典リンク</h2>
        <div id="links"></div>
      </section>
    </div>
  </div>
  <script>
    const SRC = 'daily_ai_news_report_latest.html';
    async function getVersion(){ try{ const r=await fetch('../public-pages/version.json',{cache:'no-store'}); if(!r.ok) throw new Error('no version'); const v=await r.json(); return v.sha||v.version||String(Date.now()); }catch(_){ return String(Date.now()); } }
    const params = new URLSearchParams(location.search);
    const idx = parseInt(params.get('idx')||'0',10) || 0;

    function pickItem(doc, i){
      const rows = Array.from(doc.querySelectorAll('.news-item'));
      const row = rows[i] || rows[0];
      const getText = sel => row.querySelector(sel)?.textContent?.trim() || '';
      const title = getText('.news-title');
      const score = getText('.news-score');
      const rank = getText('.news-rank') || String(i+1);
      const meta = getText('.news-meta');
      let url = '';
      const m = meta.match(/URL\s*=\s*([^,\s]+)/);
      if (m) url = m[1];
      let date = '';
      const md = meta.match(/(?:投稿日|Date|日付|謚慕ｨｿ日)=([^,]+)/);
      if (md) date = md[1].trim();
      const p = row.querySelector('p');
      const summary = p ? p.textContent.trim() : '';
      const points = Array.from(row.querySelectorAll('ul li')).map(li=>li.textContent.trim()).filter(Boolean);
      // collect links in this block
      const linkEls = Array.from(row.querySelectorAll('a[href]'));
      const links = linkEls.map(a=>({ href:a.getAttribute('href'), text:a.textContent.trim() })).filter(l=>l.href && /^https?:/i.test(l.href));
      return { title, score, rank, url, date, summary, points, links };
    }

    async function init(){
      try{
        const v = await getVersion();
        const res = await fetch(`${SRC}?v=${encodeURIComponent(v)}`, { cache:'no-store' });
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const it = pickItem(doc, idx);
        document.getElementById('title').textContent = it.title || 'AIニュース詳細';
        document.getElementById('score').textContent = it.score ? `Score ${it.score}` : '';
        document.getElementById('rank').textContent = `Rank ${it.rank}`;
        document.getElementById('date').textContent = it.date || '';
        const ext = document.getElementById('ext');
        if (it.url) { ext.href = it.url; } else { ext.style.display='none'; }
        document.getElementById('summary').textContent = it.summary || '—';
        const ul = document.getElementById('points');
        if (it.points && it.points.length){ ul.innerHTML = it.points.map(p=>`<li>${p}</li>`).join(''); } else { ul.innerHTML = '<li>—</li>'; }
        const linksDiv = document.getElementById('links');
        linksDiv.innerHTML = it.links && it.links.length ? it.links.map(l=>`<a class="actions" href="${l.href}" target="_blank" rel="noopener">${l.text||l.href}</a>`).join(' ') : '—';
      }catch(e){
        document.getElementById('summary').textContent = '読み込みに失敗しました。';
        console.error(e);
      }
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
