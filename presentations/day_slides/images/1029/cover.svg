<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fbfaf8"/><g font-family="Yu Gothic,Meiryo,sans-serif"><text x="60" y="62" fill="#325ba6" font-size="22" font-weight="700">VISIONHUB / 2026.10.29</text><text x="60" y="142" fill="#203141" font-size="48" font-weight="700">Copilot Fusion</text><text x="60" y="220" fill="#203141" font-size="49" font-weight="700">最強のAIを選ぶより、</text><text x="60" y="288" fill="#325ba6" font-size="55" font-weight="700">AIのチームを組む。</text><rect x="60" y="346" width="1080" height="176" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><rect x="96" y="385" width="245" height="92" rx="7" fill="#eaf0fa"/><text x="218" y="424" fill="#203141" font-size="27" font-weight="700" text-anchor="middle">課題と完了条件</text><text x="218" y="457" fill="#536171" font-size="20" text-anchor="middle">人が指定</text><path d="M355 431 H400 m-12-8 12 8-12 8" fill="none" stroke="#325ba6" stroke-width="3"/><rect x="418" y="385" width="340" height="92" rx="7" fill="#eaf0fa"/><text x="588" y="424" fill="#203141" font-size="27" font-weight="700" text-anchor="middle">モデルと進め方を選ぶ</text><text x="588" y="457" fill="#536171" font-size="20" text-anchor="middle">Single / Cascade / Critique</text><path d="M772 431 H817 m-12-8 12 8-12 8" fill="none" stroke="#325ba6" stroke-width="3"/><rect x="835" y="385" width="270" height="92" rx="7" fill="#fbf1db"/><text x="970" y="424" fill="#203141" font-size="27" font-weight="700" text-anchor="middle">回答・差分を確認</text><text x="970" y="457" fill="#536171" font-size="20" text-anchor="middle">最後の採否は人が判断</text><text x="60" y="577" fill="#536171" font-size="23">使ったモデルごとに課金。追加の確認が、品質・時間・費用に見合うか。</text></g></svg>