<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc"><title id="title">候補2,308件から、動く権限昇格948件と修正案まで</title><desc id="desc">OpenAIの自動パイプラインは、Linuxカーネルの候補2,308件を隔離環境で再現して1,724件に絞り、保護機能を有効にしたVMで948件の権限昇格を実証し、修正案を付けて人が確認してから報告する。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4a3f9f"/></marker></defs><rect width="1120" height="340" fill="white"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#203141"><text x="24" y="31" font-size="16" font-weight="700" fill="#526170">見つける数は増やせる。絞り込みと検証が、人の手に残る仕事</text><rect x="24" y="58" width="236" height="222" rx="12" fill="#efeefa" stroke="#c4c0e6"/><text x="44" y="90" font-size="15" font-weight="700" fill="#4a3f9f">01 発見</text><text x="44" y="138" font-size="40" font-weight="800">2,308</text><text x="44" y="162" font-size="14" fill="#526170">候補の指摘（重複除去後）</text><text x="44" y="190" font-size="13" fill="#526170">対象はカーネルの約7%</text><text x="44" y="210" font-size="13" fill="#526170">低権限で到達できる280万行</text><text x="44" y="258" font-size="13" fill="#865717">費用 約32万ドル</text><line x1="268" y1="169" x2="300" y2="169" stroke="#4a3f9f" stroke-width="2" marker-end="url(#arrow)"/><rect x="308" y="58" width="236" height="222" rx="12" fill="#efeefa" stroke="#c4c0e6"/><text x="328" y="90" font-size="15" font-weight="700" fill="#4a3f9f">02 再現</text><text x="328" y="138" font-size="40" font-weight="800">1,724</text><text x="328" y="162" font-size="14" fill="#526170">隔離VMで実際に再現（74.7%）</text><text x="328" y="190" font-size="13" fill="#526170">KASAN付きカーネルで</text><text x="328" y="210" font-size="13" fill="#526170">クラッシュを観測してから採用</text><text x="328" y="258" font-size="13" fill="#865717">費用 約7万ドル</text><line x1="552" y1="169" x2="584" y2="169" stroke="#4a3f9f" stroke-width="2" marker-end="url(#arrow)"/><rect x="592" y="58" width="236" height="222" rx="12" fill="#fff5e7" stroke="#dec9a9"/><text x="612" y="90" font-size="15" font-weight="700" fill="#865717">03 実証と修正案</text><text x="612" y="138" font-size="40" font-weight="800">948</text><text x="612" y="162" font-size="14" fill="#526170">root取得の攻撃コード＋修正案</text><text x="612" y="190" font-size="13" fill="#526170">SMEP/SMAP/KASLR 有効の</text><text x="612" y="210" font-size="13" fill="#526170">市販ディストリ構成で動作</text><text x="612" y="258" font-size="13" fill="#865717">費用 約82万ドル（1件あたり約360ドル）</text><line x1="836" y1="169" x2="868" y2="169" stroke="#4a3f9f" stroke-width="2" marker-end="url(#arrow)"/><rect x="876" y="58" width="220" height="222" rx="12" fill="white" stroke="#203141" stroke-width="2"/><text x="896" y="90" font-size="15" font-weight="700">04 人が確認して報告</text><text x="896" y="138" font-size="40" font-weight="800">304</text><text x="896" y="162" font-size="14" fill="#526170">重大なものから修正案付きで</text><text x="896" y="190" font-size="13" fill="#526170">メンテナへ開示</text><text x="896" y="210" font-size="13" fill="#526170">残りは段階的に報告中</text><text x="896" y="258" font-size="13" fill="#526170">合計 121万ドル・10日間</text><text x="24" y="318" font-size="13" fill="#526170">出典：OpenAI「A thousand fewer paths to root」（2026年10月中旬の実行）。件数と費用は同記事の公表値、面積は比率を表しません。</text></g></svg>
