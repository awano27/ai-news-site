<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc"><title id="title">Agentの状態と実行用Workerを分ける</title><desc id="desc">待機中のActor AとBはRAMとファイルを保存。リクエスト時、Aを共有Workerに復元して処理し、アプリが休止すると状態を保存してWorkerを返す。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#206c68"/></marker></defs><rect width="1120" height="340" fill="white"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#203141"><text x="24" y="31" font-size="16" font-weight="700" fill="#526170">状態は保存し、計算資源は共有する</text><rect x="24" y="66" width="306" height="195" rx="12" fill="#edf6f3" stroke="#b3ceca"/><text x="44" y="97" font-size="20" font-weight="700">待機中のActor</text><text x="44" y="122" font-size="14" fill="#526170">Actor = 1つのエージェントの実行状態</text><rect x="44" y="142" width="121" height="82" rx="7" fill="white" stroke="#b3ceca"/><text x="104" y="169" text-anchor="middle" font-size="18" font-weight="700">Actor A</text><text x="104" y="196" text-anchor="middle" font-size="14">RAM ＋ ファイル</text><rect x="180" y="142" width="129" height="82" rx="7" fill="white" stroke="#b3ceca"/><text x="244" y="169" text-anchor="middle" font-size="18" font-weight="700">Actor B</text><text x="244" y="196" text-anchor="middle" font-size="14">RAM ＋ ファイル</text><text x="44" y="246" font-size="13" fill="#526170">スナップショットとしてストレージに保持</text><path d="M345 149H470" stroke="#206c68" stroke-width="3" marker-end="url(#arrow)"/><text x="410" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#206c68">要求が届く</text><text x="410" y="137" text-anchor="middle" font-size="13">Aの状態を復元</text><rect x="487" y="66" width="288" height="195" rx="12" fill="#fff5e7" stroke="#dec9a9"/><text x="508" y="97" font-size="20" font-weight="700">共有Worker Pool</text><text x="508" y="122" font-size="14" fill="#526170">Worker内に隔離したActorを収容</text><rect x="508" y="143" width="116" height="79" rx="7" fill="#206c68"/><text x="566" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="white">Actor A</text><text x="566" y="201" text-anchor="middle" font-size="14" fill="white">処理中</text><rect x="637" y="143" width="116" height="79" rx="7" fill="white" stroke="#dec9a9"/><text x="695" y="176" text-anchor="middle" font-size="17" font-weight="700">空き実行枠</text><text x="695" y="201" text-anchor="middle" font-size="14" fill="#526170">次の仕事へ</text><text x="508" y="246" font-size="13" fill="#526170">同時に動くActorに、計算資源を割り当てる</text><path d="M788 166H824" stroke="#206c68" stroke-width="3" marker-end="url(#arrow)"/><rect x="843" y="96" width="253" height="134" rx="10" fill="#f6f7f8" stroke="#d3dde4"/><text x="969" y="131" text-anchor="middle" font-size="20" font-weight="700">コードやツールを実行</text><text x="969" y="161" text-anchor="middle" font-size="15">許可した接続先を使い</text><text x="969" y="187" text-anchor="middle" font-size="15">アプリへ結果を返す</text><path d="M631 274V307H177V274" fill="none" stroke="#206c68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="259" y="290" width="290" height="33" fill="white"/><text x="404" y="311" text-anchor="middle" font-size="15" font-weight="700" fill="#206c68">休止：保存して実行枠を返す</text></g></svg>