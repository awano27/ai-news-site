<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT Images 2.6 の入り口と、API の2モデル</title>
  <desc id="desc">ChatGPT と Codex では GIF 作成と、保存した参照画像を @名前 で呼び出す機能。API では速さ重視の Flare と、編集を重ねても細部を保ちやすい Sunburst を選ぶ。API にはマークアップ指示、SVG 出力、complexity パラメータも加わった。速度と一貫性は OpenAI の自己申告。</desc>
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", Meiryo, "Noto Sans CJK JP", sans-serif; fill: #17343c; }
    .mono { font-family: Consolas, "Yu Gothic", Meiryo, monospace; }
    .step { font-size: 16px; font-weight: 700; letter-spacing: 1px; fill: #416971; }
    .head { font-size: 25px; font-weight: 700; }
    .name { font-size: 26px; font-weight: 800; }
    .body { font-size: 18px; font-weight: 600; fill: #33525a; }
    .note { font-size: 15px; font-weight: 700; fill: #416971; }
  </style>
  <rect x="1" y="1" width="1118" height="368" rx="14" fill="#f6f8f5" stroke="#d5dfda"/>
  <path d="M432 32V300" stroke="#d5dfda" stroke-dasharray="3 6"/>
  <!-- ChatGPT / Codex -->
  <text x="40" y="52" class="step mono">01  CHATGPT / CODEX</text>
  <text x="40" y="88" class="head">全プランで使える2つの新機能</text>
  <rect x="40" y="112" width="356" height="80" rx="8" fill="#deedf6" stroke="#83aac5" stroke-width="1.6"/>
  <text x="62" y="146" class="name">GIF 作成</text>
  <text x="62" y="176" class="body">文章や静止画から、ループ動画を作る</text>
  <rect x="40" y="208" width="356" height="80" rx="8" fill="#deedf6" stroke="#83aac5" stroke-width="1.6"/>
  <text x="62" y="242" class="name">参照画像 <tspan class="mono" fill="#205578">@名前</tspan></text>
  <text x="62" y="272" class="body">一度保存し、あとから呼び出して使う</text>
  <!-- API -->
  <text x="468" y="52" class="step mono">02  API  /  GPT-IMAGE-2.6</text>
  <text x="468" y="88" class="head">用途で選ぶ2モデル</text>
  <rect x="468" y="112" width="296" height="176" rx="8" fill="#f9efd9" stroke="#c9a45c" stroke-width="1.6"/>
  <text x="490" y="148" class="name">Flare</text>
  <text x="490" y="178" class="body">速さ重視の下書き向け</text>
  <text x="490" y="210" class="body">quality=low で</text>
  <text x="490" y="238" class="body">最短 約6秒 ※</text>
  <rect x="784" y="112" width="296" height="176" rx="8" fill="#deefe4" stroke="#75a58e" stroke-width="1.6"/>
  <text x="806" y="148" class="name">Sunburst</text>
  <text x="806" y="178" class="body">質と一貫性重視の仕上げ向け</text>
  <text x="806" y="210" class="body">medium / high で、編集を</text>
  <text x="806" y="238" class="body">重ねても細部を保ちやすい ※</text>
  <text x="468" y="322" class="body">API 追加：マークアップ指示 ・ SVG 出力 ・ complexity</text>
  <text x="40" y="352" class="note">※ 速度（約6秒・以前比50%高速）と一貫性の改善は OpenAI の自己申告。第三者の再現は未確認。</text>
</svg>
