<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc"><title id="title">Copilot Automations 改善提案と人の承認</title><desc id="desc">実行の結果への人の反応を材料に改善案を作り、人が承認した設定を次回使う。拒否なら現在の設定を維持する。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#325ba6" stroke-width="2"/></marker></defs><g font-family="Yu Gothic, Meiryo, sans-serif"><rect width="100%" height="100%" fill="#fbfaf8"/><text x="60" y="55" font-size="25" fill="#325ba6" font-weight="700" text-anchor="start">VISIONHUB / ONE-PAGE BRIEF</text><text x="1540" y="55" font-size="21" fill="#536171" font-weight="400" text-anchor="end">2026.10.30 公開</text><text x="60" y="120" font-size="50" fill="#203141" font-weight="700" text-anchor="start">Copilot Automations</text><text x="60" y="182" font-size="43" fill="#325ba6" font-weight="700" text-anchor="start">仕事への反応から、次の手順の改善案を作る</text><text x="60" y="230" font-size="27" fill="#536171" font-weight="400" text-anchor="start">対象：AIの分類やレビューを直し続けている、PM・開発リーダー</text><rect x="60" y="302" width="270" height="175" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="82" y="338" font-size="22" fill="#325ba6" font-weight="700" text-anchor="start">01</text><text x="195" y="377" font-size="29" fill="#203141" font-weight="700" text-anchor="middle">実行</text><text x="195" y="419" font-size="22" fill="#536171" font-weight="400" text-anchor="middle">Issue分類などを行う</text><text x="195" y="450" font-size="22" fill="#536171" font-weight="400" text-anchor="middle">設定した条件で開始</text><path d="M330 390 H354" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="302" width="270" height="175" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="382" y="338" font-size="22" fill="#325ba6" font-weight="700" text-anchor="start">02</text><text x="495" y="377" font-size="29" fill="#203141" font-weight="700" text-anchor="middle">結果への反応</text><text x="495" y="419" font-size="22" fill="#536171" font-weight="400" text-anchor="middle">人がラベルを修正</text><text x="495" y="450" font-size="22" fill="#536171" font-weight="400" text-anchor="middle">指摘やPRを採用</text><path d="M630 390 H654" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="660" y="302" width="270" height="175" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="682" y="338" font-size="22" fill="#325ba6" font-weight="700" text-anchor="start">03</text><text x="795" y="377" font-size="29" fill="#203141" font-weight="700" text-anchor="middle">改善提案</text><text x="795" y="419" font-size="22" fill="#536171" font-weight="400" text-anchor="middle">指示文・使える操作</text><text x="795" y="450" font-size="22" fill="#536171" font-weight="400" text-anchor="middle">実行条件の変更案</text><path d="M930 390 H954" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="960" y="302" width="270" height="175" rx="12" fill="#fbf1db" stroke="#ced9e8" stroke-width="2"/><text x="982" y="338" font-size="22" fill="#325ba6" font-weight="700" text-anchor="start">04</text><text x="1095" y="377" font-size="29" fill="#203141" font-weight="700" text-anchor="middle">人が確認</text><text x="1095" y="419" font-size="22" fill="#536171" font-weight="400" text-anchor="middle">理由と差分を確認</text><text x="1095" y="450" font-size="22" fill="#536171" font-weight="400" text-anchor="middle">承認または拒否</text><path d="M1230 390 H1254" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="1260" y="302" width="270" height="175" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="1282" y="338" font-size="22" fill="#325ba6" font-weight="700" text-anchor="start">05</text><text x="1395" y="377" font-size="29" fill="#203141" font-weight="700" text-anchor="middle">次回実行</text><text x="1395" y="419" font-size="22" fill="#536171" font-weight="400" text-anchor="middle">承認した設定を使う</text><text x="1395" y="450" font-size="22" fill="#536171" font-weight="400" text-anchor="middle">通常の条件で開始</text><text x="1245" y="285" font-size="22" fill="#325ba6" font-weight="700" text-anchor="middle">承認後</text><path d="M1095 477 V518 H1370" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><text x="1370" y="551" font-size="23" fill="#203141" font-weight="700" text-anchor="middle">拒否なら今の設定を維持</text><text x="60" y="530" font-size="23" fill="#536171" font-weight="400" text-anchor="start">矢印は処理の順序。改善効果の大きさを表すものではありません。</text><rect x="60" y="588" width="1480" height="128" rx="12" fill="#fbf1db" stroke="#ced9e8" stroke-width="2"/><text x="85" y="631" font-size="29" fill="#203141" font-weight="700" text-anchor="start">人の承認は「改善案の適用前」</text><text x="85" y="674" font-size="24" fill="#203141" font-weight="400" text-anchor="start">通常の自動実行は、設定した条件と権限で動きます。モデルの重みを再学習する機能の発表ではありません。</text><text x="60" y="772" font-size="31" fill="#325ba6" font-weight="700" text-anchor="start">公式が挙げる、改善の材料</text><rect x="60" y="801" width="720" height="166" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="85" y="845" font-size="28" fill="#203141" font-weight="700" text-anchor="start">Issueの分類</text><text x="85" y="891" font-size="26" fill="#536171" font-weight="400" text-anchor="start">AIが付けたラベルを、人がどう直したか。</text><text x="85" y="932" font-size="26" fill="#536171" font-weight="400" text-anchor="start">分類の指示を見直す材料にする。</text><rect x="810" y="801" width="730" height="166" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="835" y="845" font-size="28" fill="#203141" font-weight="700" text-anchor="start">コードレビュー</text><text x="835" y="891" font-size="26" fill="#536171" font-weight="400" text-anchor="start">開発者が、指摘を採用したか。</text><text x="835" y="932" font-size="24" fill="#536171" font-weight="400" text-anchor="start">週次の別自動化が見直す構成も示されている。</text><text x="60" y="1019" font-size="29" fill="#325ba6" font-weight="700" text-anchor="start">試す条件</text><text x="60" y="1062" font-size="26" fill="#203141" font-weight="400" text-anchor="start">対象プランと private / internal リポジトリ。使える操作と実行回数を絞る。</text><text x="60" y="1104" font-size="26" fill="#203141" font-weight="400" text-anchor="start">AIクレジットとActions利用を確認。採用率だけでなく、誤りと人の確認時間を見る。</text><text x="60" y="1162" font-size="21" fill="#536171" font-weight="400" text-anchor="start">発表 2026-10-28 / 資料確認 2026-10-30 JST / GitHub Changelog・Docsを基に編集部作図</text><text x="60" y="1194" font-size="21" fill="#536171" font-weight="400" text-anchor="start">具体的な利用条件・費用・出典URLは記事本文へ。導入や性能評価を実施したものではありません。</text></g></svg>