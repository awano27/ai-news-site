<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1940" viewBox="0 0 680 1940" role="img" aria-labelledby="title desc"><title id="title">Copilot Automations 改善提案と人の承認</title><desc id="desc">実行の結果への人の反応を材料に改善案を作り、人が承認した設定を次回使う。拒否なら現在の設定を維持する。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#325ba6" stroke-width="2"/></marker></defs><g font-family="Yu Gothic, Meiryo, sans-serif"><rect width="100%" height="100%" fill="#fbfaf8"/><text x="35" y="45" font-size="22" fill="#325ba6" font-weight="700" text-anchor="start">VISIONHUB / ONE-PAGE BRIEF</text><text x="35" y="94" font-size="36" fill="#203141" font-weight="700" text-anchor="start">Copilot Automations</text><text x="35" y="147" font-size="35" fill="#325ba6" font-weight="700" text-anchor="start">仕事への反応から、</text><text x="35" y="194" font-size="35" fill="#325ba6" font-weight="700" text-anchor="start">次の手順の改善案を作る</text><text x="35" y="235" font-size="22" fill="#536171" font-weight="400" text-anchor="start">2026.10.30 公開</text><rect x="35" y="275" width="610" height="135" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="61" y="314" font-size="24" fill="#325ba6" font-weight="700" text-anchor="start">01</text><text x="117" y="323" font-size="30" fill="#203141" font-weight="700" text-anchor="start">実行</text><text x="61" y="374" font-size="25" fill="#536171" font-weight="400" text-anchor="start">Issue分類やレビューを行う</text><path d="M340 410 V446" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="452" width="610" height="135" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="61" y="491" font-size="24" fill="#325ba6" font-weight="700" text-anchor="start">02</text><text x="117" y="500" font-size="30" fill="#203141" font-weight="700" text-anchor="start">結果への反応</text><text x="61" y="551" font-size="25" fill="#536171" font-weight="400" text-anchor="start">ラベルの修正、指摘の採用など</text><path d="M340 587 V623" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="629" width="610" height="135" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="61" y="668" font-size="24" fill="#325ba6" font-weight="700" text-anchor="start">03</text><text x="117" y="677" font-size="30" fill="#203141" font-weight="700" text-anchor="start">改善提案</text><text x="61" y="728" font-size="25" fill="#536171" font-weight="400" text-anchor="start">指示文・操作・実行条件の変更案</text><path d="M340 764 V800" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="806" width="610" height="135" rx="12" fill="#fbf1db" stroke="#ced9e8" stroke-width="2"/><text x="61" y="845" font-size="24" fill="#325ba6" font-weight="700" text-anchor="start">04</text><text x="117" y="854" font-size="30" fill="#203141" font-weight="700" text-anchor="start">人が確認</text><text x="61" y="905" font-size="25" fill="#536171" font-weight="400" text-anchor="start">理由と差分を見て、承認か拒否</text><path d="M340 941 V977" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="983" width="610" height="135" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="61" y="1022" font-size="24" fill="#325ba6" font-weight="700" text-anchor="start">05</text><text x="117" y="1031" font-size="30" fill="#203141" font-weight="700" text-anchor="start">次回実行</text><text x="61" y="1082" font-size="25" fill="#536171" font-weight="400" text-anchor="start">承認した設定で、通常の条件で動く</text><text x="365" y="969" font-size="21" fill="#325ba6" font-weight="700" text-anchor="start">承認後</text><text x="35" y="1160" font-size="26" fill="#203141" font-weight="700" text-anchor="start">拒否した案は適用せず、今の設定を維持。</text><rect x="35" y="1200" width="610" height="181" rx="12" fill="#fbf1db" stroke="#ced9e8" stroke-width="2"/><text x="58" y="1244" font-size="28" fill="#203141" font-weight="700" text-anchor="start">承認は改善案の適用前</text><text x="58" y="1284" font-size="25" fill="#203141" font-weight="400" text-anchor="start">通常の自動実行を毎回承認する</text><text x="58" y="1321" font-size="25" fill="#203141" font-weight="400" text-anchor="start">仕組みではありません。</text><text x="58" y="1358" font-size="24" fill="#203141" font-weight="400" text-anchor="start">モデルの再学習の発表でもありません。</text><text x="35" y="1440" font-size="28" fill="#325ba6" font-weight="700" text-anchor="start">誰の課題？</text><text x="35" y="1483" font-size="27" fill="#203141" font-weight="400" text-anchor="start">分類・レビューの手直しが続く</text><text x="35" y="1524" font-size="27" fill="#203141" font-weight="400" text-anchor="start">PM・開発リーダー。</text><text x="35" y="1591" font-size="28" fill="#325ba6" font-weight="700" text-anchor="start">試す前の確認</text><text x="35" y="1634" font-size="25" fill="#203141" font-weight="400" text-anchor="start">対象プランと非公開のリポジトリ。</text><text x="35" y="1675" font-size="25" fill="#203141" font-weight="400" text-anchor="start">使える操作と実行回数を絞る。</text><text x="35" y="1716" font-size="25" fill="#203141" font-weight="400" text-anchor="start">AIクレジットとActions利用を記録。</text><text x="35" y="1785" font-size="21" fill="#536171" font-weight="400" text-anchor="start">図は処理順の概念図。効果の測定ではありません。</text><text x="35" y="1820" font-size="21" fill="#536171" font-weight="400" text-anchor="start">発表 10/28・資料確認 10/30 JST / 編集部作図</text><text x="35" y="1855" font-size="21" fill="#536171" font-weight="400" text-anchor="start">出典：GitHub Changelog / Docs（記事本文）</text><text x="35" y="1890" font-size="21" fill="#536171" font-weight="400" text-anchor="start">利用条件・料金の詳細は本文をご確認ください。</text></g></svg>