<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
<title id="title">Workload Mapがワークロードの定義と利用ツールの間に入る構造</title>
<desc id="desc">JobSet、LeaderWorkerSet、RayClusterの構造を、それぞれの定義を使って共通の形式で読む。構成要素、Pod設定、複製数、状態をCLI、KAI Scheduler、Run:aiが利用する。実行先の判断はスケジューラが担う。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#285ea0"/></marker></defs>
<rect width="1120" height="340" fill="#fff"/>
<g font-family="Yu Gothic,Meiryo,sans-serif" fill="#203141">
<g font-size="22" font-weight="700"><text x="40" y="40">異なるワークロード</text><text x="425" y="40">共通の読み取り</text><text x="835" y="40">利用するツール</text></g>
<g fill="#faf9f6" stroke="#d3dde4"><rect x="40" y="70" width="255" height="58" rx="9"/><rect x="40" y="150" width="255" height="58" rx="9"/><rect x="40" y="230" width="255" height="58" rx="9"/></g>
<g font-size="23" font-weight="700"><text x="61" y="108">JobSet</text><text x="61" y="188">LeaderWorkerSet</text><text x="61" y="268">RayCluster</text></g>
<g stroke="#285ea0" stroke-width="2" fill="none"><path d="M295 99H327V179H370" marker-end="url(#arrow)"/><path d="M295 179H327"/><path d="M295 259H327V179"/></g>
<rect x="380" y="70" width="360" height="218" rx="11" fill="#edf4fa" stroke="#becfde"/>
<text x="405" y="109" fill="#285ea0" font-size="26" font-weight="700">Workload Map</text>
<text x="405" y="142" font-size="19">型ごとの定義 ＋ Goライブラリ</text>
<path d="M405 158H714" stroke="#becfde"/>
<g font-size="21"><text x="405" y="197">構成要素</text><text x="575" y="197">Podの設定</text><text x="405" y="244">複製数</text><text x="575" y="244">状態</text></g>
<g stroke="#285ea0" stroke-width="2" fill="none"><path d="M740 179H780V99H820" marker-end="url(#arrow)"/><path d="M780 179H820" marker-end="url(#arrow)"/><path d="M780 179V259H820" marker-end="url(#arrow)"/></g>
<g fill="#fff5e7" stroke="#dec9a9"><rect x="830" y="70" width="250" height="58" rx="9"/><rect x="830" y="150" width="250" height="58" rx="9"/><rect x="830" y="230" width="250" height="58" rx="9"/></g>
<g font-size="21" font-weight="700"><text x="849" y="107">CLI · 構造の確認</text><text x="849" y="187">KAI · 配置の判断</text><text x="849" y="267">Run:ai · 可視化・管理</text></g>
<text x="40" y="324" font-size="17" fill="#526170">矢印は構造情報を読む関係。対応する定義と、利用ツール側の連携が必要です。</text>
</g></svg>
