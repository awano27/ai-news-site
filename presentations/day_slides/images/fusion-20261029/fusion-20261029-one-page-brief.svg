<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title desc"><title id="title">Copilot Fusion ONE-PAGE BRIEF</title><desc id="desc">人が課題と努力量を指定し、Fusionが単独・段階的な確認・別モデルのレビューを選ぶ。最終回答と差分は人が確認する。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#325ba6" stroke-width="2"/></marker></defs><g font-family="Yu Gothic, Meiryo, sans-serif"><rect width="100%" height="100%" fill="#fbfaf8"/><text x="60" y="54" font-size="25" fill="#325ba6" font-weight="700" text-anchor="start">VISIONHUB / ONE-PAGE BRIEF</text><text x="1540" y="54" font-size="21" fill="#536171" font-weight="400" text-anchor="end">2026.10.29 公開</text><text x="60" y="116" font-size="52" fill="#203141" font-weight="700" text-anchor="start">Copilot Fusion</text><text x="60" y="174" font-size="44" fill="#325ba6" font-weight="700" text-anchor="start">最強のAIを選ぶより、AIのチームを組む</text><text x="60" y="220" font-size="26" fill="#536171" font-weight="400" text-anchor="start">対象：モデルの切り替えや、別AIへのレビュー依頼に手間をかける開発チーム</text><rect x="60" y="252" width="1480" height="224" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><g fill="none" stroke="#325ba6" stroke-width="3"><circle cx="132" cy="303" r="18"/><path d="M104 363 v-16 q0-22 28-22 q28 0 28 22 v16 z"/></g><text x="132" y="420" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">人が指定</text><rect x="220" y="295" width="265" height="78" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="352.5" y="328" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">課題と完了条件</text><text x="352.5" y="356" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">例：不具合の修正案</text><path d="M485 334 H535 V334" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="540" y="281" width="480" height="106" rx="12" fill="#eaf0fa" stroke="#ced9e8" stroke-width="2"/><text x="780.0" y="314" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">Fusion がモデルと進め方を選ぶ</text><text x="780.0" y="342" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">Standard / High / Max で努力量を指定</text><path d="M1020 334 H1070 V334" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="1075" y="295" width="210" height="78" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="1180.0" y="328" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">最終回答</text><text x="1180.0" y="356" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">必要なら修正を経る</text><path d="M1285 334 H1335 V334" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><g fill="none" stroke="#325ba6" stroke-width="3"><circle cx="1420" cy="307" r="18"/><path d="M1392 367 v-16 q0-22 28-22 q28 0 28 22 v16 z"/></g><text x="1420" y="420" font-size="24" fill="#203141" font-weight="700" text-anchor="middle">人が採否を決定</text><text x="278" y="441" font-size="22" fill="#536171" font-weight="400" text-anchor="start">「AIのチーム」は役割分担のたとえ。Fusion 自体がサブエージェントを起動する機能ではありません。</text><text x="60" y="529" font-size="31" fill="#325ba6" font-weight="700" text-anchor="start">必要に応じて使い分ける、3つの進め方</text><rect x="60" y="553" width="1480" height="133" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="84" y="597" font-size="28" fill="#325ba6" font-weight="700" text-anchor="start">Single</text><text x="84" y="635" font-size="23" fill="#536171" font-weight="400" text-anchor="start">1つで解く</text><rect x="355" y="578" width="260" height="78" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="485.0" y="611" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">モデル A</text><text x="485.0" y="639" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">タスクを実行</text><path d="M615 617 H1154 V617" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="1160" y="578" width="300" height="78" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="1310.0" y="611" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">回答</text><text x="1310.0" y="639" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">単独の処理で完了</text><text x="735" y="603" font-size="22" fill="#536171" font-weight="400" text-anchor="start">Standard は単独モデルが基本</text><rect x="60" y="702" width="1480" height="164" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="84" y="747" font-size="28" fill="#325ba6" font-weight="700" text-anchor="start">Cascade</text><text x="84" y="785" font-size="23" fill="#536171" font-weight="400" text-anchor="start">確認して引き継ぐ</text><rect x="355" y="744" width="190" height="78" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="450.0" y="777" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">モデル A</text><text x="450.0" y="805" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">まず試す</text><path d="M545 783 H584 V783" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="590" y="744" width="200" height="78" rx="12" fill="#eaf0fa" stroke="#ced9e8" stroke-width="2"/><text x="690.0" y="777" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">判定モデル</text><text x="690.0" y="805" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">品質を確認</text><path d="M790 783 H835 V783" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="840" y="744" width="260" height="78" rx="12" fill="#eaf0fa" stroke="#ced9e8" stroke-width="2"/><text x="970.0" y="777" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">より強いモデル</text><text x="970.0" y="805" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">必要なら解き直す</text><path d="M1100 783 H1154 V783" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="1160" y="744" width="300" height="78" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="1310.0" y="777" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">回答</text><text x="1310.0" y="805" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">確認OKなら直接採用</text><path d="M690 744 V735 H1310 V744" fill="none" stroke="#325ba6" stroke-width="2" marker-end="url(#arrow)"/><text x="890" y="728" font-size="18" fill="#536171" font-weight="400" text-anchor="start">問題なし</text><text x="821" y="840" font-size="18" fill="#536171" font-weight="400" text-anchor="start">要改善の場合</text><rect x="60" y="882" width="1480" height="152" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="84" y="929" font-size="28" fill="#325ba6" font-weight="700" text-anchor="start">Critique</text><text x="84" y="967" font-size="23" fill="#536171" font-weight="400" text-anchor="start">別の目で見直す</text><rect x="355" y="916" width="190" height="78" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="450.0" y="949" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">モデル A</text><text x="450.0" y="977" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">草案を作る</text><path d="M545 955 H584 V955" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="590" y="916" width="240" height="78" rx="12" fill="#eaf0fa" stroke="#ced9e8" stroke-width="2"/><text x="710.0" y="949" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">別モデルが批評</text><text x="710.0" y="977" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">複数で確認する場合も</text><path d="M830 955 H869 V955" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="875" y="916" width="225" height="78" rx="12" fill="#eaf0fa" stroke="#ced9e8" stroke-width="2"/><text x="987.5" y="949" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">元のモデル A</text><text x="987.5" y="977" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">必要なら修正</text><path d="M1100 955 H1154 V955" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="1160" y="916" width="300" height="78" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="1310.0" y="949" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">回答</text><text x="1310.0" y="977" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">最終的な出力を返す</text><text x="60" y="1075" font-size="23" fill="#536171" font-weight="400" text-anchor="start">図は処理順の概念図。High／Max と方式の対応は固定ではなく、毎回複数モデルを使うとは限りません。</text><rect x="60" y="1100" width="1480" height="113" rx="12" fill="#fbf1db" stroke="#ced9e8" stroke-width="2"/><text x="86" y="1139" font-size="28" fill="#203141" font-weight="700" text-anchor="start">課金：使ったモデルごとの標準料金。追加の確認で、費用と時間が増えることも。</text><text x="86" y="1180" font-size="26" fill="#203141" font-weight="400" text-anchor="start">AIの確認だけで正しさは保証されません。テスト・差分確認・採用の判断は人が担います。</text><text x="60" y="1250" font-size="21" fill="#536171" font-weight="400" text-anchor="start">公式発表 2026-10-28 / 資料確認 2026-10-29 JST / GitHub Changelog・GitHub Docs を基に編集部作図</text><text x="60" y="1281" font-size="20" fill="#536171" font-weight="400" text-anchor="start">出典URLと利用条件の詳細は記事本文へ。Microsoft Copilot harness とは別の機能です。</text></g></svg>