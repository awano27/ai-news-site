<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1930" viewBox="0 0 680 1930" role="img" aria-labelledby="title desc"><title id="title">Copilot Fusion 縦長 ONE-PAGE BRIEF</title><desc id="desc">課題と努力量を人が指定。Fusionがモデルと進め方を選ぶ。Single、Cascade、Critiqueを使い分け、人がテストと差分を確認する。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#325ba6" stroke-width="2"/></marker></defs><g font-family="Yu Gothic, Meiryo, sans-serif"><rect width="100%" height="100%" fill="#fbfaf8"/><text x="34" y="48" font-size="23" fill="#325ba6" font-weight="700" text-anchor="start">VISIONHUB / ONE-PAGE BRIEF</text><text x="34" y="98" font-size="45" fill="#203141" font-weight="700" text-anchor="start">Copilot Fusion</text><text x="34" y="151" font-size="37" fill="#325ba6" font-weight="700" text-anchor="start">最強のAIを選ぶより、</text><text x="34" y="201" font-size="39" fill="#325ba6" font-weight="700" text-anchor="start">AIのチームを組む</text><text x="34" y="250" font-size="25" fill="#536171" font-weight="400" text-anchor="start">2026.10.29 公開</text><rect x="30" y="280" width="620" height="180" rx="12" fill="#eaf0fa" stroke="#ced9e8" stroke-width="2"/><g fill="none" stroke="#325ba6" stroke-width="3"><circle cx="82" cy="318" r="18"/><path d="M54 378 v-16 q0-22 28-22 q28 0 28 22 v16 z"/></g><text x="140" y="329" font-size="29" fill="#203141" font-weight="700" text-anchor="start">人が課題・完了条件を指定</text><text x="140" y="376" font-size="27" fill="#203141" font-weight="400" text-anchor="start">Fusion がモデルと進め方を選ぶ</text><text x="140" y="423" font-size="27" fill="#325ba6" font-weight="700" text-anchor="start">努力量：Standard / High / Max</text><text x="34" y="507" font-size="34" fill="#325ba6" font-weight="700" text-anchor="start">3つの進め方</text><rect x="30" y="532" width="620" height="226" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="52" y="579" font-size="31" fill="#325ba6" font-weight="700" text-anchor="start">Single：1つで解く</text><rect x="60" y="609" width="220" height="88" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="170.0" y="642" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">モデル A</text><text x="170.0" y="670" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">タスクを実行</text><path d="M280 654 H379 V654" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="609" width="225" height="88" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="497.5" y="642" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">回答</text><text x="497.5" y="670" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">そのまま完了</text><text x="52" y="736" font-size="26" fill="#536171" font-weight="400" text-anchor="start">Standard は単独モデルが基本</text><rect x="30" y="780" width="620" height="340" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="52" y="829" font-size="30" fill="#325ba6" font-weight="700" text-anchor="start">Cascade：確認して引き継ぐ</text><rect x="60" y="862" width="220" height="88" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="170.0" y="895" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">モデル A</text><text x="170.0" y="923" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">まず試す</text><path d="M280 907 H379 V907" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="862" width="225" height="88" rx="12" fill="#eaf0fa" stroke="#ced9e8" stroke-width="2"/><text x="497.5" y="895" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">判定モデル</text><text x="497.5" y="923" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">品質を確認</text><path d="M497 950 V978 H168 V1004" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><text x="340" y="974" font-size="22" fill="#536171" font-weight="400" text-anchor="start">要改善なら</text><path d="M591 950 V1007" fill="none" stroke="#325ba6" stroke-width="2" marker-end="url(#arrow)"/><text x="599" y="983" font-size="17" fill="#536171" font-weight="400" text-anchor="start">OK</text><rect x="60" y="1007" width="220" height="88" rx="12" fill="#eaf0fa" stroke="#ced9e8" stroke-width="2"/><text x="170.0" y="1040" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">強いモデル</text><text x="170.0" y="1068" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">解き直す</text><path d="M280 1052 H379 V1052" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="1007" width="225" height="88" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="497.5" y="1040" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">回答</text><text x="497.5" y="1068" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">確認OKなら直行</text><rect x="30" y="1144" width="620" height="340" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="52" y="1193" font-size="30" fill="#325ba6" font-weight="700" text-anchor="start">Critique：別の目で見直す</text><rect x="60" y="1226" width="220" height="88" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="170.0" y="1259" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">モデル A</text><text x="170.0" y="1287" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">草案を作る</text><path d="M280 1271 H379 V1271" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="1226" width="225" height="88" rx="12" fill="#eaf0fa" stroke="#ced9e8" stroke-width="2"/><text x="497.5" y="1259" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">別モデル</text><text x="497.5" y="1287" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">草案を批評</text><path d="M497 1314 V1342 H168 V1368" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><text x="335" y="1338" font-size="22" fill="#536171" font-weight="400" text-anchor="start">指摘を戻す</text><rect x="60" y="1371" width="220" height="88" rx="12" fill="#eaf0fa" stroke="#ced9e8" stroke-width="2"/><text x="170.0" y="1404" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">元のモデル A</text><text x="170.0" y="1432" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">必要なら修正</text><path d="M280 1416 H379 V1416" fill="none" stroke="#325ba6" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="1371" width="225" height="88" rx="12" fill="white" stroke="#ced9e8" stroke-width="2"/><text x="497.5" y="1404" font-size="25" fill="#203141" font-weight="700" text-anchor="middle">回答</text><text x="497.5" y="1432" font-size="19" fill="#536171" font-weight="400" text-anchor="middle">最終出力</text><rect x="30" y="1510" width="620" height="231" rx="12" fill="#fbf1db" stroke="#ced9e8" stroke-width="2"/><text x="52" y="1554" font-size="29" fill="#203141" font-weight="700" text-anchor="start">人がテスト・差分を確認し、採用</text><text x="52" y="1601" font-size="28" fill="#203141" font-weight="400" text-anchor="start">使ったモデルごとに料金が発生。</text><text x="52" y="1647" font-size="26" fill="#203141" font-weight="400" text-anchor="start">追加確認で費用・時間が増える場合も。</text><text x="52" y="1695" font-size="26" fill="#203141" font-weight="400" text-anchor="start">必ず安く・正しくなる保証はありません。</text><text x="34" y="1784" font-size="25" fill="#536171" font-weight="400" text-anchor="start">図は処理順の概念。連携は必要なときだけ。</text><text x="34" y="1824" font-size="25" fill="#536171" font-weight="400" text-anchor="start">サブエージェントの起動とは別の仕組みです。</text><text x="34" y="1869" font-size="23" fill="#536171" font-weight="400" text-anchor="start">発表 10/28・確認 10/29 JST・編集部作図</text><text x="34" y="1907" font-size="22" fill="#536171" font-weight="400" text-anchor="start">出典：GitHub Changelog / Docs（記事本文）</text></g></svg>