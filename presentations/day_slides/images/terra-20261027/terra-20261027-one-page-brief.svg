<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc"><title id="title">GPT-6.1 Terra ONE-PAGE BRIEF</title><desc id="desc">請求書と画面を読み、次の操作を決め、接続されたツールで入力し、結果を確認する流れ。人が登録を承認する。標準 API の単価と全体費用の違いを示す概念図。性能の実測ではない。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#086b80" stroke-width="1.5"/></marker></defs><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="0" y="0" width="1280" height="960" rx="0" fill="#fbfaf8" stroke="#fbfaf8"/><text x="48" y="47" font-size="18" fill="#086b80" font-weight="700">VISIONHUB / ONE-PAGE BRIEF</text><text x="916" y="47" font-size="17" fill="#536171" font-weight="400">掲載 10/27 · リリース 10/26</text><text x="48" y="103" font-size="43" fill="#203141" font-weight="700">GPT-6.1 Terra</text><text x="48" y="148" font-size="34" fill="#086b80" font-weight="700">画面を見て操作する AI が、さらに安く</text><rect x="48" y="177" width="1184" height="66" rx="12" fill="#e8f3f4" stroke="#c9d9dd"/><text x="70" y="204" font-size="16" fill="#086b80" font-weight="700">誰の課題？</text><text x="70" y="229" font-size="25" fill="#203141" font-weight="700">書類とアプリを行き来し、同じ転記・確認を繰り返す担当者</text><text x="48" y="285" font-size="24" fill="#086b80" font-weight="700">請求書入力を例に：画面を読む → 操作する → 結果を確かめる</text><rect x="48" y="311" width="240" height="304" rx="12" fill="white" stroke="#c9d9dd"/><g transform="translate(109 335) scale(1)"><rect x="0" y="0" width="120" height="142" rx="5" fill="white" stroke="#c9d9dd"/><text x="15" y="28" font-size="20" fill="#086b80" font-weight="700">請求書</text><path d="M15 44 H105 M15 64 H85 M15 84 H105" fill="none" stroke="#c9d9dd" stroke-width="3"/><text x="15" y="117" font-size="20" fill="#203141" font-weight="700">¥12,000</text></g><text x="69" y="516" font-size="25" fill="#203141" font-weight="700">① 資料と画面</text><text x="69" y="554" font-size="20" fill="#536171" font-weight="400">日付・金額・取引先</text><text x="69" y="586" font-size="20" fill="#536171" font-weight="400">対象と範囲を指定</text><path d="M298 448 H334" fill="none" stroke="#086b80" stroke-width="3" marker-end="url(#arr)"/><rect x="350" y="311" width="248" height="304" rx="12" fill="#e8f3f4" stroke="#c9d9dd"/><circle cx="474" cy="403" r="59" fill="white" stroke="#086b80" stroke-width="3"/><text x="430" y="400" font-size="28" fill="#086b80" font-weight="700">Terra</text><text x="433" y="428" font-size="18" fill="#536171" font-weight="400">モデル</text><text x="372" y="516" font-size="23" fill="#203141" font-weight="700">② 次の操作を判断</text><text x="372" y="554" font-size="20" fill="#536171" font-weight="400">画面の項目を読む</text><text x="372" y="586" font-size="20" fill="#536171" font-weight="400">入力・クリックを選ぶ</text><path d="M608 448 H644" fill="none" stroke="#086b80" stroke-width="3" marker-end="url(#arr)"/><rect x="660" y="311" width="300" height="304" rx="12" fill="white" stroke="#c9d9dd"/><g transform="translate(700 348) scale(1)"><rect x="0" y="0" width="220" height="140" rx="7" fill="white" stroke="#c9d9dd"/><rect x="0" y="0" width="220" height="24" rx="7" fill="#e8f3f4" stroke="#c9d9dd"/><text x="13" y="18" font-size="13" fill="#086b80" font-weight="700">会計フォーム</text><text x="12" y="53" font-size="13" fill="#203141" font-weight="400">日付</text><rect x="62" y="36" width="140" height="23" rx="3" fill="#f4f7f8" stroke="#c9d9dd"/><text x="70" y="53" font-size="12" fill="#203141" font-weight="400">2026 / 10 / 27</text><text x="12" y="85" font-size="13" fill="#203141" font-weight="400">金額</text><rect x="62" y="68" width="140" height="23" rx="3" fill="#f4f7f8" stroke="#c9d9dd"/><text x="70" y="85" font-size="13" fill="#203141" font-weight="400">12,000</text><rect x="122" y="105" width="80" height="22" rx="3" fill="#e8f3f4" stroke="#c9d9dd"/><text x="134" y="121" font-size="12" fill="#086b80" font-weight="700">下書き</text><path d="M110 140 V159 M70 160 H150" fill="none" stroke="#086b80" stroke-width="3"/><path d="M180 76 L180 100 L187 94 L193 106 L199 103 L193 91 L204 91 Z" fill="none" stroke="#086b80" stroke-width="2"/></g><text x="682" y="550" font-size="25" fill="#203141" font-weight="700">③ 接続先で入力</text><text x="682" y="586" font-size="20" fill="#536171" font-weight="400">実行環境が操作する</text><path d="M970 448 H1006" fill="none" stroke="#086b80" stroke-width="3" marker-end="url(#arr)"/><rect x="1022" y="311" width="210" height="304" rx="12" fill="#fbf2df" stroke="#c9d9dd"/><circle cx="1127" cy="380" r="17" fill="white" stroke="#086b80" stroke-width="3"/><path d="M1099 437 V419 Q1099 399 1127 399 Q1155 399 1155 419 V437 Z" fill="none" stroke="#086b80" stroke-width="3"/><text x="1044" y="516" font-size="25" fill="#203141" font-weight="700">人が確認</text><text x="1044" y="554" font-size="20" fill="#536171" font-weight="400">内容を照合</text><text x="1044" y="586" font-size="20" fill="#086b80" font-weight="700">登録を承認</text><path d="M815 622 V649 H474 V622" fill="none" stroke="#086b80" stroke-width="3" marker-end="url(#arr)"/><text x="48" y="649" font-size="19" fill="#086b80" font-weight="700">新しい画面を戻し、再確認 ↶</text><text x="48" y="690" font-size="18" fill="#536171" font-weight="400">API には実行環境との接続が必要。図は作業の概念で、実測した効果ではありません。</text><rect x="48" y="719" width="1184" height="105" rx="12" fill="#e8f3f4" stroke="#c9d9dd"/><text x="70" y="749" font-size="18" fill="#086b80" font-weight="700">標準 API / 100万トークンあたり</text><text x="70" y="795" font-size="30" fill="#203141" font-weight="700">入力 $1</text><text x="305" y="795" font-size="30" fill="#203141" font-weight="700">キャッシュ入力 $0.05</text><text x="820" y="795" font-size="30" fill="#203141" font-weight="700">出力 $5</text><text x="48" y="855" font-size="21" fill="#203141" font-weight="700">GPT-6.1 Sol / GPT-5.6 Terra の標準単価の半分。</text><text x="48" y="886" font-size="20" fill="#536171" font-weight="400">全タスク総額の半額保証ではありません。複雑なコードは Sol / Astra。</text><text x="48" y="915" font-size="18" fill="#536171" font-weight="400">ChatGPT の月額料金とは別の話です。</text><text x="48" y="943" font-size="14" fill="#536171" font-weight="400">出典：openai.com/index/introducing-gpt-6-1-terra/ · 詳細は同梱 HTML · 確認 2026-10-27 JST</text></g></svg>