<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1420" viewBox="0 0 640 1420" role="img" aria-labelledby="title desc"><title id="title">GPT-6.1 Terra ONE-PAGE BRIEF 縦長版</title><desc id="desc">請求書と画面を読み、次の操作を決め、接続されたツールで入力し、結果を確認する流れ。人が登録を承認する。標準 API の単価と全体費用の違いを示す概念図。性能の実測ではない。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#086b80" stroke-width="1.5"/></marker></defs><g font-family="Yu Gothic,Meiryo,sans-serif"><rect x="0" y="0" width="640" height="1420" rx="0" fill="#fbfaf8" stroke="#fbfaf8"/><text x="28" y="39" font-size="17" fill="#086b80" font-weight="700">VISIONHUB / ONE-PAGE BRIEF</text><text x="28" y="94" font-size="38" fill="#203141" font-weight="700">GPT-6.1 Terra</text><text x="28" y="140" font-size="30" fill="#203141" font-weight="700">画面を見て操作する AI が、</text><text x="28" y="183" font-size="36" fill="#086b80" font-weight="700">さらに安く。</text><text x="28" y="220" font-size="18" fill="#536171" font-weight="400">掲載 10/27 · リリース 10/26</text><rect x="28" y="246" width="584" height="91" rx="12" fill="#e8f3f4" stroke="#c9d9dd"/><text x="48" y="277" font-size="18" fill="#086b80" font-weight="700">誰の課題？</text><text x="48" y="310" font-size="25" fill="#203141" font-weight="700">書類とアプリを行き来する担当者</text><rect x="28" y="365" width="584" height="178" rx="12" fill="white" stroke="#c9d9dd"/><g transform="translate(48 387) scale(0.9)"><rect x="0" y="0" width="120" height="142" rx="5" fill="white" stroke="#c9d9dd"/><text x="15" y="28" font-size="20" fill="#086b80" font-weight="700">請求書</text><path d="M15 44 H105 M15 64 H85 M15 84 H105" fill="none" stroke="#c9d9dd" stroke-width="3"/><text x="15" y="117" font-size="20" fill="#203141" font-weight="700">¥12,000</text></g><text x="183" y="405" font-size="26" fill="#203141" font-weight="700">① 資料と画面を渡す</text><text x="183" y="447" font-size="23" fill="#536171" font-weight="400">請求書の日付・金額を</text><text x="183" y="484" font-size="23" fill="#536171" font-weight="400">どの欄へ入れるか確認</text><path d="M320 550 V580" fill="none" stroke="#086b80" stroke-width="3" marker-end="url(#arr)"/><rect x="28" y="595" width="584" height="158" rx="12" fill="#e8f3f4" stroke="#c9d9dd"/><circle cx="109" cy="674" r="52" fill="white" stroke="#086b80" stroke-width="3"/><text x="72" y="682" font-size="25" fill="#086b80" font-weight="700">Terra</text><text x="183" y="637" font-size="26" fill="#203141" font-weight="700">② 次の操作を判断</text><text x="183" y="679" font-size="23" fill="#536171" font-weight="400">画面の項目を読み、</text><text x="183" y="716" font-size="23" fill="#536171" font-weight="400">入力・クリックを選ぶ</text><path d="M320 760 V790" fill="none" stroke="#086b80" stroke-width="3" marker-end="url(#arr)"/><rect x="28" y="805" width="584" height="190" rx="12" fill="white" stroke="#c9d9dd"/><g transform="translate(44 847) scale(0.65)"><rect x="0" y="0" width="220" height="140" rx="7" fill="white" stroke="#c9d9dd"/><rect x="0" y="0" width="220" height="24" rx="7" fill="#e8f3f4" stroke="#c9d9dd"/><text x="13" y="18" font-size="13" fill="#086b80" font-weight="700">会計フォーム</text><text x="12" y="53" font-size="13" fill="#203141" font-weight="400">日付</text><rect x="62" y="36" width="140" height="23" rx="3" fill="#f4f7f8" stroke="#c9d9dd"/><text x="70" y="53" font-size="12" fill="#203141" font-weight="400">2026 / 10 / 27</text><text x="12" y="85" font-size="13" fill="#203141" font-weight="400">金額</text><rect x="62" y="68" width="140" height="23" rx="3" fill="#f4f7f8" stroke="#c9d9dd"/><text x="70" y="85" font-size="13" fill="#203141" font-weight="400">12,000</text><rect x="122" y="105" width="80" height="22" rx="3" fill="#e8f3f4" stroke="#c9d9dd"/><text x="134" y="121" font-size="12" fill="#086b80" font-weight="700">下書き</text><path d="M110 140 V159 M70 160 H150" fill="none" stroke="#086b80" stroke-width="3"/><path d="M180 76 L180 100 L187 94 L193 106 L199 103 L193 91 L204 91 Z" fill="none" stroke="#086b80" stroke-width="2"/></g><text x="213" y="849" font-size="26" fill="#203141" font-weight="700">③ 接続先で操作する</text><text x="213" y="891" font-size="23" fill="#536171" font-weight="400">実行環境が入力し、</text><text x="213" y="928" font-size="23" fill="#086b80" font-weight="700">新しい画面を戻す ↶</text><text x="213" y="968" font-size="21" fill="#203141" font-weight="700">→ 人が内容と登録を確認</text><rect x="28" y="1022" width="584" height="152" rx="12" fill="#e8f3f4" stroke="#c9d9dd"/><text x="48" y="1057" font-size="20" fill="#086b80" font-weight="700">標準 API / 100万トークンあたり</text><text x="48" y="1101" font-size="31" fill="#203141" font-weight="700">入力 $1  /  出力 $5</text><text x="48" y="1144" font-size="27" fill="#203141" font-weight="700">キャッシュ入力 $0.05</text><text x="28" y="1218" font-size="23" fill="#203141" font-weight="700">GPT-6.1 Sol / GPT-5.6 Terra の</text><text x="28" y="1256" font-size="21" fill="#536171" font-weight="400">標準単価の半分。総額の半額保証ではありません。</text><text x="28" y="1296" font-size="22" fill="#536171" font-weight="400">API には実行環境との接続が必要。</text><text x="28" y="1335" font-size="22" fill="#086b80" font-weight="700">複雑なコードは Sol / Astra を検討。</text><text x="28" y="1375" font-size="17" fill="#536171" font-weight="400">公式例を基にした概念図。性能の実測ではありません。</text><text x="28" y="1402" font-size="16" fill="#536171" font-weight="400">出典：OpenAI Terra 発表・API docs（同梱 HTML）</text></g></svg>