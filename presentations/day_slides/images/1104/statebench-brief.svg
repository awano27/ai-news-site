<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc">
  <title id="title">二つのセルで追う、値をコピーした時点と最終値</title>
  <desc id="desc">最初はAが赤、Bが青。Aの値をBにコピーすると、どちらも赤になる。その後Aだけを緑に上書きするので、最終値はAが緑、Bが赤。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="3.5" orient="auto">
      <path d="M0 0l7 3.5-7 3.5" fill="none" stroke="#8da3a9" stroke-width="1.3"/>
    </marker>
    <marker id="copy-arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="3.5" orient="auto">
      <path d="M0 0l7 3.5-7 3.5" fill="none" stroke="#9a3f3c" stroke-width="1.4"/>
    </marker>
    <style>
      text { font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; fill: #17343c; }
      .mono { font-family: Consolas, "Yu Gothic", Meiryo, monospace; }
      .step { font-size: 16px; font-weight: 700; letter-spacing: 1px; fill: #416971; }
      .action { font-size: 25px; font-weight: 700; }
      .state { font-size: 27px; font-weight: 700; }
      .state-red { fill: #7e3330; }
      .state-blue { fill: #205578; }
      .state-green { fill: #165e4d; }
      .trace { fill: none; stroke: #8da3a9; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="368" rx="14" fill="#f6f8f5" stroke="#d5dfda"/>
  <path d="M139 107H1080M139 215H1080M139 321H1080" fill="none" stroke="#d5dfda" stroke-dasharray="3 6"/>
  <g text-anchor="middle">
    <text x="270" y="49" class="step mono">01</text>
    <text x="270" y="84" class="action">最初の値</text>
    <text x="620" y="49" class="step mono">02</text>
    <text x="620" y="84" class="action">A の値を B にコピー</text>
    <text x="970" y="49" class="step mono">03</text>
    <text x="970" y="84" class="action">A を緑に書き換える</text>
  </g>
  <g font-size="21" font-weight="700">
    <text x="38" y="162">セル A</text>
    <text x="38" y="279">セル B</text>
  </g>
  <g>
    <path class="trace" d="M353 154H530"/>
    <path d="M353 162C412 162 444 268 530 268" fill="none" stroke="#9a3f3c" stroke-width="3.2" marker-end="url(#copy-arrow)"/>
    <path class="trace" d="M703 154H880" stroke-dasharray="5 5"/>
    <path d="M703 268H880" fill="none" stroke="#9a3f3c" stroke-width="2.7" marker-end="url(#copy-arrow)"/>
  </g>
  <g fill="#f9e5df" stroke="#c8978a" stroke-width="1.6">
    <rect x="192" y="123" width="156" height="62" rx="8"/>
    <rect x="542" y="123" width="156" height="62" rx="8"/>
    <rect x="542" y="237" width="156" height="62" rx="8"/>
    <rect x="892" y="237" width="156" height="62" rx="8"/>
  </g>
  <rect x="192" y="237" width="156" height="62" rx="8" fill="#deedf6" stroke="#83aac5" stroke-width="1.6"/>
  <rect x="892" y="123" width="156" height="62" rx="8" fill="#deefe4" stroke="#75a58e" stroke-width="1.6"/>
  <g class="state" text-anchor="middle">
    <text x="270" y="165" class="state-red">赤</text>
    <text x="270" y="279" class="state-blue">青</text>
    <text x="620" y="165" class="state-red">赤</text>
    <text x="620" y="279" class="state-red">赤</text>
    <text x="970" y="165" class="state-green">緑</text>
    <text x="970" y="279" class="state-red">赤</text>
  </g>
  <text x="38" y="348" font-size="16" font-weight="700" fill="#416971">赤い矢印は、コピーした値の行き先を示す。</text>
</svg>
