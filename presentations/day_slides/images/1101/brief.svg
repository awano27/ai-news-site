<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
<title id="title">AIの操作と、成果物の検証をつなぐ</title><desc id="desc">AIエージェントがagent-desktopを介してアプリを観察、操作、再観察する。生成された帳票は、別に用意した合格条件で内容と見た目を検証する。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#285ea0"/></marker></defs>
<rect width="1120" height="390" fill="#f4f7fb"/>
<g font-family="Yu Gothic,Meiryo,sans-serif" fill="#203141">
<text x="32" y="42" font-size="15" font-weight="700" fill="#285ea0">ONE-PAGE BRIEF / 操作と品質を、別の証拠で確かめる</text>
<rect x="30" y="82" width="230" height="152" rx="12" fill="white" stroke="#bbcddd"/>
<text x="54" y="117" font-size="15" fill="#526170">判断と手順を担当</text><text x="54" y="153" font-size="25" font-weight="700">AIエージェント</text><text x="54" y="191" font-size="17">何を操作するか選ぶ</text><text x="54" y="216" font-size="17">結果を読んで次へ進む</text>
<path d="M266 156H308" stroke="#285ea0" stroke-width="3" marker-end="url(#a)"/>
<rect x="324" y="82" width="300" height="152" rx="12" fill="#285ea0"/>
<text x="348" y="117" font-size="15" fill="#dce9ff">OSのUI構造を使う道具</text><text x="348" y="153" font-size="27" font-weight="700" fill="white">agent-desktop</text><text x="348" y="191" font-size="17" fill="white">観察 → refで操作 → 再観察</text><text x="348" y="216" font-size="17" fill="white">アプリのボタン・入力欄を扱う</text>
<path d="M630 156H672" stroke="#285ea0" stroke-width="3" marker-end="url(#a)"/>
<rect x="688" y="82" width="400" height="152" rx="12" fill="white" stroke="#bbcddd"/>
<rect x="713" y="106" width="58" height="85" rx="4" fill="#edf4fa" stroke="#7c9ab7"/><path d="M724 124h36M724 139h36M724 154h27M724 169h32" stroke="#7c9ab7" stroke-width="3"/>
<text x="792" y="118" font-size="15" fill="#526170">成果物の例</text><text x="792" y="154" font-size="25" font-weight="700">出力された帳票</text><text x="792" y="191" font-size="17">文字欠け？ 件数？ 改ページ？</text><text x="792" y="216" font-size="17">操作の応答だけでは判定できない</text>
<path d="M888 240V271" stroke="#285ea0" stroke-width="3" marker-end="url(#a)"/>
<rect x="30" y="286" width="1058" height="76" rx="10" fill="#fff5e7" stroke="#d5b686"/>
<text x="54" y="317" font-size="18" font-weight="700" fill="#865717">エンジニアが設計すること</text><text x="54" y="344" font-size="18">確認対象・証拠・合格条件・人に戻す条件 → 成果物を検証して、採用／修正／保留を決める</text>
</g></svg>