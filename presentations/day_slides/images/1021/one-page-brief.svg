<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1260" role="img" aria-labelledby="title desc"><title id="title">DeepInfer ONE-PAGE BRIEF</title><desc id="desc">GPU基盤担当者とAIサービス企業向け。モデル、公開エンジン、別途必要な運用層の三層を区別。オフラインで評価し、オンライン運用は別に設計する。</desc><style>text{font-family:'Yu Gothic',Meiryo,sans-serif;fill:#203a36}.label{font-size:23px;letter-spacing:3px}.head{font-size:56px;font-weight:700}.sub{font-size:30px}.body{font-size:27px}.small{font-size:23px}</style><rect width="1680" height="1260" fill="#f5f8f4"/><path d="M65 70h1550" stroke="#28705c" stroke-width="7"/><text x="65" y="115" class="label">VISIONHUB / ONE-PAGE BRIEF / 2026.10.21</text><text x="65" y="205" class="head">AIを動かすエンジンを、公開。</text><text x="65" y="266" class="sub">大量の処理を担う基盤担当者へ。完成したオンラインサービスとは別。</text><rect x="65" y="310" width="1550" height="145" rx="12" fill="white" stroke="#b8cfc3"/><text x="98" y="357" class="label">誰の、どんな課題？</text><text x="98" y="402" class="body">GPU基盤担当者・AIサービス運営企業・AIアーキテクト</text><text x="98" y="440" class="body">大量の要求を、待ち時間と計算資源の両方を見ながら処理したい。</text><rect x="65" y="500" width="450" height="310" rx="12" fill="#fff" stroke="#b8cfc3"/><text x="95" y="550" class="label">01 / モデル</text><text x="95" y="610" class="sub">DeepSeek-V4.1-Flash</text><text x="95" y="670" class="body">何を答えられるかを担う</text><text x="95" y="715" class="body">学習済みのモデル。</text><text x="95" y="775" class="small">エンジンとは別の構成要素</text><path d="M530 650h35l-10-10m10 10-10 10" fill="none" stroke="#28705c" stroke-width="4"/><rect x="580" y="500" width="495" height="310" rx="12" fill="#e2efe7" stroke="#28705c" stroke-width="3"/><text x="610" y="550" class="label">02 / 今回公開されたエンジン</text><text x="610" y="610" class="head">DeepInfer</text><text x="610" y="670" class="body">計算・分散処理を効率化。</text><text x="610" y="715" class="body">公開版はオフライン推論が中心。</text><text x="610" y="775" class="small">Apache-2.0 / 対応基盤が必要</text><path d="M1090 650h35l-10-10m10 10-10 10" fill="none" stroke="#28705c" stroke-width="4"/><rect x="1140" y="500" width="475" height="310" rx="12" fill="#fff7e8" stroke="#a57939" stroke-dasharray="9 7" stroke-width="3"/><text x="1170" y="550" class="label">03 / 別途必要なサービス運用層</text><text x="1170" y="610" class="sub">オンライン運用の仕組み</text><text x="1170" y="670" class="body">KVキャッシュ管理</text><text x="1170" y="715" class="body">Prefill / Decode 分離</text><text x="1170" y="760" class="body">負荷分散</text><text x="65" y="855" class="small">概念図：矢印は構成の関係を示します。製品画面・実装済みサービスの構成図ではありません。</text><rect x="65" y="900" width="1550" height="245" rx="12" fill="#203a36"/><text x="98" y="950" class="sub" style="fill:white">最初の一歩：対応する設備で、実際の処理条件を再現する</text><text x="98" y="1005" class="body" style="fill:white">対応：NVIDIA SM100 / Huawei Ascend 950（同等性能という意味ではない）</text><text x="98" y="1055" class="body" style="fill:white">比較：応答待ち時間、処理量、メモリ、運用を含めた費用</text><text x="98" y="1105" class="body" style="fill:white">注意：一般のPCに入れるだけでは使えない。実運用の効果は未検証。</text><text x="65" y="1200" class="small">出典：deepseek-ai/DeepInfer README・Inference Deployment Q&amp;A / 2026-10-21確認</text></svg>