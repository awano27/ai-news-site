<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1270" viewBox="0 0 640 1270" role="img" aria-labelledby="title desc"><title id="title">A5 ONE-PAGE BRIEF：スマートフォン版</title><desc id="desc">過去の決定と変更された資料をA5が照合し、影響と次の対応を提案する。人が根拠を確認して進めるか判断する。開発者記事のデモを基にした概念図であり、性能の実測ではない。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#225b89" stroke-width="1.5"/></marker></defs><g font-family="&quot;Yu Gothic&quot;,Meiryo,&quot;Noto Sans CJK JP&quot;,sans-serif"><rect x="0" y="0" width="640" height="1270" rx="0" fill="#fbfaf8" stroke="#fbfaf8"/><text x="30" y="40" font-size="18" fill="#225b89" font-weight="700">VISIONHUB / ONE-PAGE BRIEF</text><text x="30" y="94" font-size="42" fill="#203141" font-weight="700">A5  変更を、</text><text x="30" y="147" font-size="42" fill="#203141" font-weight="700">次の判断につなぐ</text><text x="30" y="188" font-size="20" fill="#536171" font-weight="400">記事日 10/26 · 発表日 10/23</text><rect x="30" y="216" width="580" height="96" rx="12" fill="#eaf4f1" stroke="#c4d8d0"/><circle cx="76" cy="244" r="17" fill="#fff" stroke="#17675d" stroke-width="3"/><path d="M47 302 V287 Q47 266 76 266 Q105 266 105 287 V302 Z" fill="#eaf4f1" stroke="#17675d" stroke-width="3"/><text x="126" y="253" font-size="25" fill="#203141" font-weight="700">企画・開発の進行役、</text><text x="126" y="290" font-size="25" fill="#203141" font-weight="700">共有資料の管理担当者へ</text><rect x="30" y="343" width="580" height="143" rx="12" fill="#fff" stroke="#d4dce3"/><text x="50" y="377" font-size="22" fill="#225b89" font-weight="700">01  記憶と変更</text><text x="50" y="420" font-size="27" fill="#203141" font-weight="700">個人用の資料庫 → チーム共有へ</text><text x="50" y="459" font-size="22" fill="#536171" font-weight="400">以前の決定と、新しい資料を照合する。</text><path d="M320 492 L320 511" fill="none" stroke="#225b89" stroke-width="3" marker-end="url(#arr)"/><rect x="30" y="517" width="580" height="143" rx="12" fill="#eaf2fa" stroke="#d4dce3"/><text x="50" y="551" font-size="22" fill="#225b89" font-weight="700">02  影響を捉える</text><text x="50" y="594" font-size="27" fill="#203141" font-weight="700">権限・管理責任も変わる</text><text x="50" y="633" font-size="22" fill="#536171" font-weight="400">過去の判断の前提を、見直す。</text><path d="M320 666 L320 685" fill="none" stroke="#225b89" stroke-width="3" marker-end="url(#arr)"/><rect x="30" y="691" width="580" height="143" rx="12" fill="#fff" stroke="#d4dce3"/><text x="50" y="725" font-size="22" fill="#225b89" font-weight="700">03  次の対応を提案</text><text x="50" y="768" font-size="27" fill="#203141" font-weight="700">誰が閲覧・編集・保守を担う？</text><text x="50" y="807" font-size="22" fill="#536171" font-weight="400">根拠と見直し案を提示する。</text><path d="M320 840 L320 859" fill="none" stroke="#225b89" stroke-width="3" marker-end="url(#arr)"/><rect x="30" y="865" width="580" height="143" rx="12" fill="#eaf2fa" stroke="#d4dce3"/><text x="50" y="899" font-size="22" fill="#225b89" font-weight="700">04  人が確認する</text><text x="50" y="942" font-size="27" fill="#203141" font-weight="700">採用・修正・保留を判断</text><text x="50" y="981" font-size="22" fill="#536171" font-weight="400">提案を確認し、進めるか決める。</text><text x="30" y="1064" font-size="20" fill="#536171" font-weight="400">開発者記事のデモを再構成した概念図。</text><rect x="30" y="1090" width="580" height="119" rx="12" fill="#fbf2df" stroke="#ded0ae"/><text x="50" y="1124" font-size="24" fill="#203141" font-weight="700">技術プレビュー / 外部モデルAPIが必要</text><text x="50" y="1158" font-size="23" fill="#536171" font-weight="400">macOS・Linux x86_64（検証不十分）</text><text x="50" y="1191" font-size="23" fill="#536171" font-weight="400">長期の精度・実測月額は未確認。</text><text x="30" y="1240" font-size="18" fill="#536171" font-weight="400">出典：Hugging Face「Introducing A5」10/23</text></g></svg>