<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc"><title id="title">A5 ONE-PAGE BRIEF：変更を、次の判断につなぐ</title><desc id="desc">過去の決定と変更された資料をA5が照合し、影響と次の対応を提案する。人が根拠を確認して進めるか判断する。開発者記事のデモを基にした概念図であり、性能の実測ではない。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#225b89" stroke-width="1.5"/></marker></defs><g font-family="&quot;Yu Gothic&quot;,Meiryo,&quot;Noto Sans CJK JP&quot;,sans-serif"><rect x="0" y="0" width="1280" height="920" rx="0" fill="#fbfaf8" stroke="#fbfaf8"/><text x="48" y="48" font-size="18" fill="#225b89" font-weight="700">VISIONHUB  /  ONE-PAGE BRIEF</text><text x="900" y="48" font-size="17" fill="#536171" font-weight="400">記事日 10/26 · 発表日 10/23</text><text x="48" y="106" font-size="43" fill="#203141" font-weight="700">A5  変更を、次の判断につなぐ</text><text x="48" y="150" font-size="23" fill="#536171" font-weight="400">要件や予定が変わる仕事で、再説明・再依頼の負担を減らすことを目指す。</text><rect x="48" y="184" width="1184" height="82" rx="12" fill="#eaf4f1" stroke="#c4d8d0"/><circle cx="86" cy="211" r="17" fill="#fff" stroke="#17675d" stroke-width="3"/><path d="M57 269 V254 Q57 233 86 233 Q115 233 115 254 V269 Z" fill="#eaf4f1" stroke="#17675d" stroke-width="3"/><text x="137" y="217" font-size="18" fill="#17675d" font-weight="700">誰の課題？</text><text x="137" y="247" font-size="25" fill="#203141" font-weight="700">企画・開発の進行役、共有資料の管理担当者</text><text x="48" y="311" font-size="25" fill="#225b89" font-weight="700">記憶 ＋ 変更 → 影響の見直し → 提案 → 人の判断</text><rect x="48" y="338" width="255" height="280" rx="12" fill="#fff" stroke="#d4dce3"/><rect x="68" y="364" width="84" height="96" rx="5" fill="#fff" stroke="#225b89"/><path d="M85 395 L135 395" fill="none" stroke="#8daec5" stroke-width="3"/><path d="M85 418 L135 418" fill="none" stroke="#8daec5" stroke-width="3"/><path d="M85 441 L135 441" fill="none" stroke="#8daec5" stroke-width="3"/><rect x="105" y="380" width="84" height="96" rx="5" fill="#fff" stroke="#225b89"/><path d="M122 411 L172 411" fill="none" stroke="#8daec5" stroke-width="3"/><path d="M122 434 L172 434" fill="none" stroke="#8daec5" stroke-width="3"/><path d="M122 457 L172 457" fill="none" stroke="#8daec5" stroke-width="3"/><text x="68" y="515" font-size="24" fill="#203141" font-weight="700">過去の決定と根拠</text><text x="68" y="552" font-size="21" fill="#536171" font-weight="400">個人用の資料庫</text><text x="68" y="587" font-size="21" fill="#17675d" font-weight="700">変更：チーム共有へ</text><path d="M308 466 L352 466" fill="none" stroke="#225b89" stroke-width="3" marker-end="url(#arr)"/><rect x="365" y="338" width="250" height="280" rx="12" fill="#eaf2fa" stroke="#a9c4d8"/><circle cx="490" cy="415" r="43" fill="#fff" stroke="#225b89" stroke-width="3"/><text x="462" y="429" font-size="35" fill="#225b89" font-weight="700">A5</text><text x="388" y="515" font-size="24" fill="#203141" font-weight="700">何を見直す？</text><text x="388" y="552" font-size="21" fill="#536171" font-weight="400">以前の前提と照合</text><text x="388" y="587" font-size="21" fill="#17675d" font-weight="700">権限・管理責任へ</text><path d="M620 466 L664 466" fill="none" stroke="#225b89" stroke-width="3" marker-end="url(#arr)"/><rect x="677" y="338" width="250" height="280" rx="12" fill="#fff" stroke="#d4dce3"/><rect x="700" y="366" width="105" height="109" rx="5" fill="#fff" stroke="#225b89"/><path d="M717 397 L788 397" fill="none" stroke="#8daec5" stroke-width="3"/><path d="M717 420 L788 420" fill="none" stroke="#8daec5" stroke-width="3"/><path d="M717 443 L788 443" fill="none" stroke="#8daec5" stroke-width="3"/><text x="698" y="515" font-size="24" fill="#203141" font-weight="700">次の対応を提案</text><text x="698" y="552" font-size="21" fill="#536171" font-weight="400">誰が閲覧・編集？</text><text x="698" y="587" font-size="21" fill="#536171" font-weight="400">誰が保守を担当？</text><path d="M932 466 L976 466" fill="none" stroke="#225b89" stroke-width="3" marker-end="url(#arr)"/><rect x="989" y="338" width="243" height="280" rx="12" fill="#eef5f0" stroke="#b5cdbd"/><circle cx="1107" cy="393" r="17" fill="#fff" stroke="#17675d" stroke-width="3"/><path d="M1078 451 V436 Q1078 415 1107 415 Q1136 415 1136 436 V451 Z" fill="#eaf4f1" stroke="#17675d" stroke-width="3"/><text x="1010" y="515" font-size="24" fill="#203141" font-weight="700">人が確認する</text><text x="1010" y="552" font-size="21" fill="#536171" font-weight="400">根拠と影響を読む</text><text x="1010" y="587" font-size="21" fill="#17675d" font-weight="700">採用・修正・保留</text><text x="48" y="650" font-size="17" fill="#536171" font-weight="400">開発者記事のデモを再構成。矢印は情報と判断の流れで、実測した効果を表しません。</text><path d="M48 682 L1232 682" fill="none" stroke="#d4dce3" stroke-width="3"/><text x="48" y="721" font-size="18" fill="#225b89" font-weight="700">もう一つのデモ</text><text x="48" y="760" font-size="27" fill="#203141" font-weight="700">仕入先の遅延</text><path d="M257 752 L311 752" fill="none" stroke="#225b89" stroke-width="3" marker-end="url(#arr)"/><text x="329" y="760" font-size="27" fill="#203141" font-weight="700">テスト・リリース計画の見直し案</text><path d="M768 752 L822 752" fill="none" stroke="#225b89" stroke-width="3" marker-end="url(#arr)"/><text x="840" y="760" font-size="27" fill="#17675d" font-weight="700">確認後に進める</text><rect x="48" y="797" width="1184" height="80" rx="12" fill="#fbf2df" stroke="#ded0ae"/><text x="68" y="828" font-size="22" fill="#203141" font-weight="700">技術プレビュー / macOS・Linux x86_64 / 外部モデルAPIが必要</text><text x="68" y="857" font-size="19" fill="#536171" font-weight="400">Linux版は検証不十分の注記あり。長期の見逃し・過剰提案の少なさ、実測月額は未確認。</text><text x="48" y="903" font-size="15" fill="#536171" font-weight="400">出典：huggingface.co/blog/KYLN24/introducing-a5 · 発表 2026-10-23 / 確認 2026-10-26</text></g></svg>