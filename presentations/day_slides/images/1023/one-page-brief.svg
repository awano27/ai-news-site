<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#247b79" stroke-width="1.5"/></marker></defs><rect width="1400" height="960" fill="#f5f8f6"/><g font-family="Meiryo,sans-serif" fill="#203141"><text x="70" y="75" font-size="20" fill="#247b79">VISIONHUB / ONE-PAGE BRIEF / 2026.10.23</text><text x="70" y="143" font-size="46" font-weight="bold">AIに会社の仕事を任せる、その前に。</text><text x="70" y="190" font-size="25">情報の意味、使える範囲、人が決める場所を整える。</text>
<g transform="translate(70 245)"><rect width="360" height="360" rx="22" fill="white" stroke="#cfddda"/><g transform="translate(85 30)"><path d="M10 10h85l25 25v125H10z" fill="#e6f0f1" stroke="#287b7a" stroke-width="3"/><path d="M95 10v30h25M30 65h60M30 85h60M30 105h40" fill="none" stroke="#287b7a" stroke-width="4"/><rect x="125" y="55" width="65" height="100" rx="5" fill="#d7e6f0"/><path d="M137 75h40M137 95h40M137 115h30" stroke="#225b89" stroke-width="4"/></g><text x="30" y="235" font-size="29" font-weight="bold">散らばる情報</text><text x="30" y="279" font-size="23">文書・表・データベース</text><text x="30" y="317" font-size="23">誰が何を判断するかも整理</text></g>
<g transform="translate(520 245)"><rect width="360" height="360" rx="22" fill="#e7f2ef" stroke="#87b8ac"/><g stroke="#247b79" stroke-width="4"><path d="M95 80l80 70 90-70M175 150v55" fill="none"/><circle cx="95" cy="80" r="29" fill="white"/><circle cx="265" cy="80" r="29" fill="white"/><circle cx="175" cy="150" r="35" fill="white"/></g><text x="30" y="235" font-size="29" font-weight="bold">意味と関係をつなぐ</text><text x="30" y="279" font-size="23">案件・担当・承認条件など</text><text x="30" y="317" font-size="23">共通の定義をAIが参照</text></g>
<g transform="translate(970 245)"><rect width="360" height="360" rx="22" fill="white" stroke="#cfddda"/><circle cx="140" cy="76" r="30" fill="#d7e6f0" stroke="#225b89" stroke-width="3"/><path d="M85 183v-40a55 55 0 0 1 110 0v40" fill="#d7e6f0" stroke="#225b89" stroke-width="3"/><rect x="174" y="119" width="90" height="65" rx="8" fill="#edf5ef" stroke="#247b79" stroke-width="3"/><path d="M194 151l14 14 30-35" fill="none" stroke="#247b79" stroke-width="5"/><text x="30" y="235" font-size="29" font-weight="bold">人が関わり、実行へ</text><text x="30" y="279" font-size="23">AIの判断・関数の実行</text><text x="30" y="317" font-size="23">必要な箇所で人が承認</text></g>
<g stroke="#247b79" stroke-width="4" marker-end="url(#arrow)"><path d="M447 420h52"/><path d="M897 420h52"/></g><rect x="70" y="650" width="1260" height="105" rx="15" fill="#203f49"/><g fill="white" font-size="27"><text x="110" y="713">全体を支える統制</text><text x="450" y="713">アクセス権</text><text x="735" y="713">実行前の承認</text><text x="1040" y="713">根拠・結果の記録</text></g><text x="70" y="817" font-size="25" font-weight="bold">導入の焦点：AIの賢さだけでなく、組織の判断手順を設計する。</text><text x="70" y="864" font-size="23">接続・同期とルールの整備が必要。正確さや安全、効果は個別に確かめる。</text><text x="70" y="917" font-size="18" fill="#526170">公式説明を基にした概念図。実際の画面・内部構成・導入効果を示すものではありません。</text></g></svg>