<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840"><rect width="1400" height="840" fill="#eef6f4"/><g font-family="Yu Gothic,Meiryo,Hiragino Sans,Noto Sans CJK JP,sans-serif" fill="#243b3b">
<text x="56" y="58" font-size="20" fill="#187477">OPENAI  /  公開は2026年11月22日  /  数値はすべて自己申告</text>
<text x="56" y="118" font-size="32" font-weight="bold">OpenAI、事前学習の内部数値を公開し、業界共通の上限を提案</text>
<text x="56" y="162" font-size="22">困惑度の論考</text>

<rect x="56" y="198" width="628" height="372" rx="20" fill="white" stroke="#a8c8bf"/>
<text x="86" y="244" font-size="22" font-weight="bold">公開した数値（自己申告）</text>
<text x="86" y="274" font-size="16" fill="#586966">社内コードベース由来の、評価用データ</text>
<text x="86" y="328" font-size="20">GPT-3.5</text>
<text x="320" y="328" font-size="22" font-weight="bold" fill="#187477">約 0.99</text>
<text x="86" y="368" font-size="20">GPT-4</text>
<text x="320" y="368" font-size="22" font-weight="bold" fill="#187477">約 0.91</text>
<text x="86" y="408" font-size="20">いま</text>
<text x="320" y="408" font-size="22" font-weight="bold" fill="#187477">0.8 未満</text>
<text x="86" y="448" font-size="20">数学で画期的、と本文</text>
<text x="320" y="448" font-size="22" font-weight="bold" fill="#187477">約 0.76</text>
<text x="86" y="500" font-size="20">次の窓（著者の外挿）</text>
<text x="320" y="500" font-size="22" font-weight="bold" fill="#187477">約 0.68–0.7</text>
<text x="86" y="540" font-size="16" fill="#586966">値は対数困惑度（交差エントロピー損失）。低いほど予測が良い</text>

<rect x="716" y="198" width="628" height="372" rx="20" fill="white" stroke="#187477" stroke-width="3"/>
<text x="746" y="244" font-size="22" font-weight="bold">提案の中身</text>
<text x="746" y="274" font-size="16" fill="#586966">本文が述べる、2つの柱</text>
<text x="746" y="332" font-size="20" font-weight="bold" fill="#187477">1. 指標を共有する</text>
<text x="746" y="368" font-size="20">困惑度を、研究室のあいだで比べる</text>
<text x="746" y="428" font-size="20" font-weight="bold" fill="#187477">2. 共通の上限を置く</text>
<text x="746" y="464" font-size="20">監視が具体的な到達点に達するまで、</text>
<text x="746" y="496" font-size="20">その上限を越えない、と約束する</text>
<text x="746" y="540" font-size="16" fill="#586966">上限の数値そのものは、本文に書かれていない</text>

<rect x="56" y="592" width="1288" height="194" rx="20" fill="white" stroke="#a8c8bf"/>
<text x="86" y="640" font-size="22" font-weight="bold">いま言える範囲</text>
<text x="86" y="690" font-size="22">共通の上限は、業界の合意ではない。いまは提案である</text>
<text x="86" y="732" font-size="20">研究室間の比較は難しい、と本文も認める。手順を書く推論では、困惑度は下がらない</text>
<text x="86" y="762" font-size="16" fill="#586966">出典：openai.com/index/perplexity-and-intelligence/（2026年11月22日）</text>
</g></svg>