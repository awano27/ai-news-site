    <script>
        Reveal.initialize({
            embedded: true,
            width: '100%',
            height: '100%',
            margin: 0,
            minScale: 1,
            maxScale: 1,
            hash: false,
            controls: false,
            controlsLayout: 'edges',
            controlsBackArrows: 'faded',
            progress: false,
            center: false,
            transition: 'none',
            backgroundTransition: 'none',
            keyboard: false,
            overview: false,
            touch: false,
            loop: false,
            fragments: false,
            mouseWheel: false,
            hideInactiveCursor: false,
            disableLayout: true
        });

        // Add keyboard shortcuts
        document.addEventListener('keydown', function(event) {
            switch(event.key) {
                case 'h':
                case 'H':
                    window.location.href = '../day_slides_index.html';
                    break;
                case 'r':
                case 'R':
                    window.location.href = '../ai_ranking_report_20250826.html';
                    break;
                case 'm':
                case 'M':
                    window.location.href = '../daily_ai_news_report_20250826.html';
                    break;
                case 'Escape':
                    window.history.back();
                    break;
            }
        });

        // Add slide animations
        Reveal.on('slidechanged', function(event) {
            const currentSlide = event.currentSlide;
            const fadeElements = currentSlide.querySelectorAll('.fade-in');
            
            fadeElements.forEach((element, index) => {
                element.style.animationDelay = `${index * 0.2}s`;
                element.classList.add('fade-in');
            });
        });

        // Progress bar animations
        Reveal.on('ready', function() {
            setTimeout(() => {
                const progressBars = document.querySelectorAll('.progress-fill');
                progressBars.forEach(bar => {
                    bar.style.width = bar.style.width;
                });
            }, 500);
        });
