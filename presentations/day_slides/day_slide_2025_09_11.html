<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>2025年09月11日 - Claude、ファイルの作成・編集に対応</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.4.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.4.0/dist/theme/white.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    /* 安定表示用: スクロールレイアウトを強制 */
    html, body { height: 100%; overflow-y: auto !important; overflow-x: hidden; -webkit-overflow-scrolling: touch; background:#fff; }
    .reveal { position: relative !important; height: auto !important; min-height: 100vh; overflow: visible !important; font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .reveal .slides { position: relative !important; width:100% !important; height:auto !important; top:0 !important; left:0 !important; margin:0 !important; padding:20px !important; text-align:center !important; overflow:visible !important; transform:none !important; }
    .reveal .slides section { position:relative !important; width:100% !important; max-width: 1100px; margin:0 auto 28px; padding:20px; background:#fff; border:1px solid #e5e7eb; border-radius:16px; box-shadow:0 8px 20px rgba(0,0,0,.08); text-align:left; display:block !important; opacity:1 !important; visibility:visible !important; transform:none !important; }
    .reveal .controls, .reveal .progress, .reveal .playback, .reveal .slide-number { display:none !important; }
    h1 { font-size:2.4em !important; font-weight:800 !important; letter-spacing:-.02em; margin:.2em 0 .1em; color:#0f172a; }
    h2 { font-size:1.6em !important; font-weight:700 !important; color:#0f172a !important; border-bottom:3px solid #3b82f6; padding-bottom:.25em; margin-bottom:.5em; }
    p, li { color:#0f172a; }
    .badge { display:inline-block; background:#3b82f6; color:#fff; font-weight:800; border-radius:999px; padding:4px 10px; font-size:.9em; }
    ul { margin-left:1.2em; }
    .links a { display:inline-block; margin:6px 8px 0 0; padding:8px 12px; border-radius:999px; background:#0f172a; color:#fff; text-decoration:none; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/reveal.js@4.4.0/dist/reveal.js"></script>
</head>
<body>
  <div class="reveal"><div class="slides">
    <section class="title">
      <span class="badge">2025/09/11</span>
      <h1>Claude can now create and edit files</h1>
      <p style="color:#475569">日次AIニューススライド（要点ダイジェスト）</p>
    </section>

    <section>
      <h2>概要</h2>
      <ul>
        <li>Claude がファイルの「作成・編集」に対応。</li>
        <li>対応例: スプレッドシート、ドキュメント、スライド、PDF。</li>
        <li>出典リンク提示で透明性を担保。</li>
        <li>提供形態: GA（一般提供）。</li>
      </ul>
    </section>

    <section>
      <h2>参考リンク</h2>
      <div class="links">
        <a href="https://x.com/AnthropicAI" target="_blank" rel="noopener">X (Twitter)</a>
        <a href="https://www.anthropic.com/news/create-files" target="_blank" rel="noopener">Blog</a>
        <a href="https://www.anthropic.com/claude/docs" target="_blank" rel="noopener">Docs</a>
      </div>
    </section>
  </div></div>
  <script>
    // JSが失敗しても静的表示されるよう CSS側で可視化済み
    if (window.Reveal) {
      Reveal.initialize({ embedded:true, width:'100%', height:'100%', margin:0, minScale:1, maxScale:1, hash:false, controls:false, progress:false, center:false, transition:'none' });
    }
  </script>
  <noscript>
    <div style="max-width:1100px;margin:12px auto;padding:12px;color:#334155;border:1px solid #e5e7eb;border-radius:8px;">
      JavaScriptが無効でも本ページは閲覧可能です。上部のセクションをご覧ください。
    </div>
  </noscript>
</body>
</html>
