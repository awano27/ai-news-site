<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=https://awano27.github.io/daily-ai-news-pages/">
  <link rel="canonical" href="https://awano27.github.io/daily-ai-news-pages/">
  <meta name="robots" content="noindex">
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e5e7eb}
    a{color:#93c5fd;text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
  <script>
    (function(){
      var target = 'https://awano27.github.io/daily-ai-news-pages/';
      try { window.location.replace(target); } catch(e) { window.location.href = target; }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div>
      <p>AIニュース一覧へ移動します…</p>
      <p><a href="https://awano27.github.io/daily-ai-news-pages/">移動しない場合はこちらをクリック</a></p>
    </div>
  </div>
</body>
</html>
