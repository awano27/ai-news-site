<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Intelligence Platform - 統合ダッシュボード</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #3b82f6;
      --surface: #ffffff;
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans JP', sans-serif; background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%); color: var(--text); }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--primary); color: #e5e7eb; padding: 20px 14px; }
    .sidebar h1 { font-size: 16px; margin: 0 0 16px; font-weight: 800; letter-spacing: .02em; }
    .nav { display: grid; gap: 6px; }
    .nav a { display: block; padding: 10px 12px; border-radius: 8px; color: #cbd5e1; text-decoration: none; }
    .nav a:hover, .nav a.active { background: #1e293b; color: #fff; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .top { height: 60px; background: var(--surface); border-bottom: 1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding: 0 16px; }
    .crumb { color: var(--muted); font-weight: 600; }
    .content { flex: 1; overflow: auto; }
    .hero { padding: 20px 20px 6px; }
    .hero h2 { margin: 0 0 6px; font-size: 20px; font-weight: 900; color: var(--primary); }
    .hero p { margin: 0; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; padding: 12px 20px 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.06); cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.10); }
    .card .title { font-size: 16px; font-weight: 800; color: var(--primary); margin: 8px 0; }
    .card .desc { color: var(--muted); }
    .frame { width: 100%; height: calc(100vh - 60px); border: none; display: none; background: var(--surface); }
    .external { display:none; padding: 8px 20px; }
    .external a { color: var(--accent); font-weight: 800; text-decoration: none; }
    .external a:hover { text-decoration: underline; }
  </style>
  <script>
    const pageMap = {
      dashboard: null,
      integrated: 'integrated_report.html',
      ranking: 'ai_ranking_interactive.html',
      slides: 'day_slides_index.html',
      news: 'daily_ai_news_report_latest.html',
      dailyNews: 'https://awano27.github.io/daily-ai-news-pages/'
    };

    function setActive(page) {
      document.querySelectorAll('.nav a[data-page]').forEach(a => a.classList.toggle('active', a.dataset.page === page));
      document.getElementById('crumb').textContent = (
        page === 'dashboard' ? 'Dashboard' :
        page === 'integrated' ? 'レポート' :
        page === 'ranking' ? 'インタラクティブランキング' :
        page === 'slides' ? '毎日スライド' :
        page === 'news' ? '詳細レポート' :
        page === 'dailyNews' ? 'AIニュース一覧' : page
      );
    }

    function showDashboard() {
      document.getElementById('dashboard').style.display = 'block';
      const frame = document.getElementById('frame');
      frame.style.display = 'none';
      frame.removeAttribute('src');
      document.getElementById('external').style.display = 'none';
      setActive('dashboard');
    }

    function loadPage(page) {
      if (page === 'dashboard') return showDashboard();
      const url = pageMap[page];
      const dash = document.getElementById('dashboard');
      const frame = document.getElementById('frame');
      const external = document.getElementById('external');
      dash.style.display = 'none';
      frame.style.display = 'block';
      frame.src = url || '';
      setActive(page);
      if (url && url.startsWith('http')) {
        external.style.display = 'block';
        document.getElementById('external-link').href = url;
        // Fallback: open new navigation if blocked
        setTimeout(() => {
          try {
            const ok = frame.contentDocument && frame.contentDocument.body && frame.contentDocument.body.children.length > 0;
            if (!ok) window.location.href = url;
          } catch (e) {
            window.location.href = url;
          }
        }, 1000);
      } else {
        external.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.nav a[data-page]').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); loadPage(a.dataset.page); }));
      showDashboard();
    });
  </script>
  <!-- No external fonts/scripts to avoid blocking -->
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Presentations</h1>
      <nav class="nav">
        <a href="#" data-page="dashboard" class="active">🏠 Dashboard</a>
        <a href="#" data-page="integrated">🧭 レポート</a>
        <a href="#" data-page="ranking">📈 ランキング</a>
        <a href="#" data-page="slides">📋 毎日スライド</a>
        <a href="#" data-page="dailyNews">📰 AIニュース一覧</a>
        <a href="#" data-page="news">📑 詳細レポート</a>
      </nav>
    </aside>
    <main class="main">
      <div class="top"><div class="crumb" id="crumb">Dashboard</div></div>
      <div class="content">
        <section id="dashboard">
          <div class="hero">
            <h2>統合ダッシュボード</h2>
            <p>レポート・ニュース・スライドへ素早く移動できます。</p>
          </div>
          <div class="grid">
            <div class="card" onclick="loadPage('integrated')">
              <div class="title">レポート</div>
              <div class="desc">主要トピックを俯瞰する要約レポート</div>
            </div>
            <div class="card" onclick="loadPage('slides')">
              <div class="title">毎日スライド</div>
              <div class="desc">日毎のスライド一覧にアクセス</div>
            </div>
            <div class="card" onclick="loadPage('dailyNews')">
              <div class="title">AIニュース一覧</div>
              <div class="desc">最新のAIニュース（外部ページ）</div>
            </div>
            <div class="card" onclick="loadPage('ranking')">
              <div class="title">インタラクティブランキング</div>
              <div class="desc">スコアに基づくランキングダッシュボード</div>
            </div>
          </div>
        </section>
        <iframe id="frame" class="frame" title="Content"></iframe>
        <div id="external" class="external">外部で開く: <a id="external-link" href="#" target="_blank" rel="noopener noreferrer">リンク</a></div>
      </div>
    </main>
  </div>
</body>
</html>
