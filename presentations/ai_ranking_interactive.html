<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIニュース アーカイブ検索 | AI Intelligence Hub</title>
  <meta name="description" content="AI Intelligence Hubの公開ニュースデータをカテゴリ、日付、スコアで絞り込めるインタラクティブ検索ページ。" />
  <link rel="canonical" href="https://visionhub.jp/presentations/ai_ranking_interactive.html" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <style>
    :root{--bg:#f8fafc;--fg:#0f172a;--accent:#3b82f6;--border:#e2e8f0;--muted:#64748b;--ok:#10b981}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    .header{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
    .header h1{margin:0 0 6px 0;font-size:22px}
    .header .desc{color:var(--muted);font-size:14px}
    .controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;align-items:flex-start}
    .controls select{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;min-width:220px;font-weight:600}
    .controls input[type="checkbox"]{margin:0}
    .select-label{display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)}
    @media (min-width:640px){.select-label{flex-direction:row;align-items:center}}
    .category-filters{display:flex;flex-wrap:wrap;gap:8px}
    .category-filters label{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:13px;color:var(--muted);transition:background .2s,border-color .2s,color .2s}
    .category-filters label:hover{border-color:var(--accent);color:var(--accent)}
    .category-filters input:checked+span{color:var(--fg);font-weight:600}
    .layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}
    .card h2{margin:0 0 10px 0;font-size:16px}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid var(--border);padding:8px;text-align:left;font-size:14px}
    th{font-weight:800}
    .pill{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800}
    .muted{color:var(--muted)}
    .source a{color:var(--accent);text-decoration:none}
    .source a:hover{text-decoration:underline}
    @media (max-width:960px){.layout{grid-template-columns:1fr}}
  </style>
<!-- GA4_INJECTED v1 -->
<script src="/assets/js/analytics.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔍 AIニュース アーカイブ検索</h1>
      <div class="desc">
        過去のAIニュースアーカイブを検索・閲覧できます。
        データソースを切り替えて、Daily AI News（最新36件）、日付別、またはGitHub統合データ（427件）から情報を探索できます。
        カテゴリフィルターで絞り込みも可能です。
      </div>
      <div class="controls">
        <label class="select-label">データソース
          <select id="dataSource">
            <option value="" disabled selected>読み込み中…</option>
          </select>
        </label>
        <div id="categoryFilters" class="category-filters">
          <label><input type="checkbox" class="cat" value="テクノロジー・ツール" checked><span>テクノロジー・ツール</span></label>
          <label><input type="checkbox" class="cat" value="ビジネス・投資" checked><span>ビジネス・投資</span></label>
          <label><input type="checkbox" class="cat" value="SNS・論文" checked><span>SNS・論文</span></label>
          <label><input type="checkbox" class="cat" value="AI Technology" checked><span>AI Technology</span></label>
        </div>
      </div>
      <div class="desc" id="meta"></div>
    </div>

    <div class="layout">
      <div class="card">
        <h2>上位トピック（棒グラフ）</h2>
        <canvas id="bar"></canvas>
      </div>
      <div class="card">
        <h2>ハイライト</h2>
        <div id="highlight" class="muted">読み込み中…</div>
      </div>
      <div class="card" style="grid-column:1/-1">
        <h2>アーカイブ一覧</h2>
        <table>
          <thead>
            <tr><th>No.</th><th>タイトル</th><th>カテゴリ</th><th>重要度</th><th>日付</th><th>ソース</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const COLORS=['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#0ea5e9','#84cc16'];
    let barChart=null;
    const DATA_BASE_URL='https://visionhub.jp/public-pages/news/';
    const SOURCE_META=new Map();
    const FALLBACK_SOURCES=[
      {value:`${DATA_BASE_URL}2025-10-28_daily.json`,label:'📰 Daily AI News（2025-10-28 / 36件）',meta:{type:'daily',date:'2025-10-28',count:36,source:'daily-ai-news-pages'}},
      {value:`${DATA_BASE_URL}2025-09-13_github.json`,label:'📦 GitHub統合データ（427件）',meta:{type:'github',date:'2025-09-13 (GitHub)',count:427,source:'GitHub Repository'}},
      {value:`${DATA_BASE_URL}2025-09-13.json`,label:'🗂️ 2025-09-13（アーカイブ）',meta:{type:'archive',date:'2025-09-13',count:1}},
      {value:`${DATA_BASE_URL}2025-09-12.json`,label:'🗂️ 2025-09-12（アーカイブ）',meta:{type:'archive',date:'2025-09-12',count:1}},
      {value:`${DATA_BASE_URL}2025-09-07.json`,label:'🗂️ 2025-09-07（アーカイブ）',meta:{type:'archive',date:'2025-09-07',count:1}}
    ];

    function byStarsDesc(a,b){return (b.stars||0)-(a.stars||0)}

    function escapeHtml(value){
      return (value??'').toString().replace(/[&<>"']/g,c=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      })[c]||c);
    }

    function safeText(value){
      return (value??'').toString();
    }

    function safeUrl(url){
      if(!url) return '';
      try{
        const parsed=new URL(url,location.href);
        if(parsed.protocol==='http:'||parsed.protocol==='https:'){return parsed.href;}
      }catch(e){return ''}
      return '';
    }

    function deterministicBoost(text){
      const str=(text||'').toString();
      let hash=0;
      for(let i=0;i<str.length;i++){
        hash=(hash<<5)-hash+str.charCodeAt(i);
        hash|=0;
      }
      return Math.abs(hash)%20;
    }

    function normalizeSource(src,fallback='ソース'){
      if(!src) return {name:fallback,url:''};
      if(typeof src==='string') return {name:src,url:''};
      if(typeof src==='object'){
        return {
          name:src.name||src.title||src.source||fallback,
          url:src.url||src.href||''
        };
      }
      return {name:fallback,url:''};
    }

    function getSelectedCategories(){
      return [...document.querySelectorAll('.cat:checked')].map(el=>el.value);
    }

    function attachCategoryListeners(handler){
      document.querySelectorAll('.cat').forEach(cb=>{
        if(!cb.dataset.bound){
          cb.addEventListener('change',handler);
          cb.dataset.bound='1';
        }
      });
    }

    function ensureCategoryFilters(categories,onChange){
      const container=document.getElementById('categoryFilters');
      if(!container) return;
      const existing=new Set([...container.querySelectorAll('input.cat')].map(el=>el.value));
      let added=false;
      categories.forEach(cat=>{
        if(!cat||existing.has(cat)) return;
        const label=document.createElement('label');
        const input=document.createElement('input');
        input.type='checkbox';
        input.className='cat';
        input.value=cat;
        input.checked=true;
        const span=document.createElement('span');
        span.textContent=cat;
        label.appendChild(input);
        label.appendChild(span);
        container.appendChild(label);
        added=true;
      });
      if(added&&typeof onChange==='function'){
        attachCategoryListeners(onChange);
      }
    }

    function extractItems(data){
      const items=[];

      function calculateScore(item,index){
        let score=Number(item.score||item.importance_score||item.stars||0);
        if(!score){
          const titleLength=(item.title||'').length;
          score+=Math.floor(titleLength/10);
          const categoryWeights={
            'AI Technology':95,
            'テクノロジー・ツール':85,
            'ビジネス・投資':75,
            'SNS・論文':65
          };
          score+=categoryWeights[item.category]||50;
          score+=deterministicBoost(item.title||item.summary||item.url||'')+(index%10);
        }
        return Math.max(score,1);
      }

      if(data.articles&&Array.isArray(data.articles)){
        const catMap={business:'ビジネス・投資',tools:'テクノロジー・ツール',posts:'SNS・論文'};
        data.articles.forEach((it,index)=>{
          const mappedCat=catMap[it.category]||it.category||'';
          const stars=calculateScore({...it,category:mappedCat},index);
          const source=normalizeSource({name:it.source||'ソース',url:it.url});
          items.push({
            date:it.published_at||'',
            title:it.title||'',
            summary:it.summary||'',
            stars,
            category:mappedCat,
            source
          });
        });
      }else if(data.raw_github_data&&Array.isArray(data.raw_github_data)){
        data.raw_github_data.forEach((it,index)=>{
          const stars=calculateScore(it,index);
          const source=normalizeSource({name:it.source||'ソース',url:it.url});
          items.push({
            date:it.timestamp||data.date||'',
            title:it.title||'',
            summary:it.summary||'',
            stars,
            category:it.category||'Other',
            source
          });
        });
      }else if(data.items&&Array.isArray(data.items)){
        data.items.forEach((it,index)=>{
          const stars=calculateScore(it,index);
          const source=normalizeSource(it.url?{name:'リンク',url:it.url}:it.source,'ソース');
          items.push({
            date:it.date||data.date||'',
            title:it.title||'',
            summary:it.summary||'',
            stars,
            category:it.category||'Other',
            source
          });
        });
      }else if(data.sections&&typeof data.sections==='object'){
        let globalIndex=0;
        Object.entries(data.sections).forEach(([cat,list])=>{
          (list||[]).forEach((it,localIndex)=>{
            const stars=calculateScore({...it,category:cat},globalIndex+localIndex);
            const source=normalizeSource(it.source,'ソース');
            items.push({
              date:it.date||'',
              title:it.title||'',
              summary:it.summary||'',
              stars,
              category:cat,
              source
            });
          });
          globalIndex+=(list||[]).length;
        });
      }

      return items;
    }

    function formatDateTime(input){
      if(!input) return '';
      const date=new Date(input);
      if(Number.isNaN(date.getTime())) return input;
      return date.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',hour12:false});
    }

    function renderMeta(data,stats={},url){
      const el=document.getElementById('meta');
      if(!el) return;
      const parts=[];
      const meta=SOURCE_META.get(url)||{};
      if(meta.type==='daily') parts.push('種別: Daily AI News');
      if(meta.type==='github') parts.push('種別: GitHub統合データ');
      if(meta.type==='archive') parts.push('種別: アーカイブ');
      if(meta.date) parts.push(`アーカイブ日: ${meta.date}`);
      if(meta.count) parts.push(`登録件数: ${meta.count}件`);
      if(data.metadata?.total_articles) parts.push(`データ件数: ${data.metadata.total_articles}件`);
      else if(typeof data.count==='number') parts.push(`データ件数: ${data.count}件`);
      if(typeof stats.totalItems==='number') parts.push(`全件: ${stats.totalItems}件`);
      if(typeof stats.filteredItems==='number'&&stats.filteredItems!==stats.totalItems) parts.push(`表示: ${stats.filteredItems}件`);
      if(typeof stats.categoryCount==='number'&&stats.categoryCount>0) parts.push(`カテゴリ: ${stats.categoryCount}種`);
      if(data.date) parts.push(`日付: ${data.date}`);
      if(data.generated_at) parts.push(`生成: ${formatDateTime(data.generated_at)}`);
      if(data.metadata?.extracted_at) parts.push(`取得: ${formatDateTime(data.metadata.extracted_at)}`);
      if(meta.source) parts.push(`ソース: ${meta.source}`);
      else if(data.metadata?.source) parts.push(`ソース: ${data.metadata.source}`);
      if(data.metadata?.url) parts.push(`URL: ${data.metadata.url}`);
      el.textContent=parts.filter(Boolean).join(' | ');
    }

    function renderHighlight(items){
      const el=document.getElementById('highlight');
      if(!el) return;
      if(!items||!items.length){
        el.textContent='ハイライト項目はありません。';
        return;
      }
      const top=items[0];
      const title=escapeHtml(top.title||'');
      const summary=escapeHtml(top.summary||`スコア: ${top.stars}`);
      const source=normalizeSource(top.source);
      const href=safeUrl(source.url);
      const linkHtml=href?`<a href="${href}" target="_blank" rel="noopener">${escapeHtml(source.name||'リンク')}</a>`:'';
      el.innerHTML=`
        <div style="margin-bottom:6px"><span class="pill">${escapeHtml(top.category||'TOP')}</span> <strong>${title}</strong></div>
        <div class="muted" style="margin-bottom:6px">${summary}</div>
        <div class="source">${linkHtml}</div>
      `;
    }

    function renderTable(items){
      const tbody=document.getElementById('rows');
      if(!tbody) return;
      if(!items||!items.length){
        tbody.innerHTML='<tr><td colspan="6" class="muted">選択された条件に一致する項目がありません。</td></tr>';
        return;
      }
      tbody.innerHTML=items.map((it,index)=>{
        const source=normalizeSource(it.source);
        const href=safeUrl(source.url);
        const srcName=escapeHtml(source.name||'ソース');
        const srcCell=href?`<a href="${href}" target="_blank" rel="noopener">${srcName||'リンク'}</a>`:`<span class="muted">${srcName||'ソース不明'}</span>`;
        const rank=index+1;
        const rankBadge=rank<=3?`<span class="pill" style="background:${rank===1?'#ef4444':rank===2?'#f59e0b':'#22c55e'}">${rank}</span>`:`<span style="font-weight:800">${rank}</span>`;
        return `<tr>
          <td>${rankBadge}</td>
          <td><strong>${escapeHtml(it.title)}</strong></td>
          <td><span class="pill" style="font-size:11px">${escapeHtml(it.category)}</span></td>
          <td style="font-weight:800;color:var(--accent)">${it.stars||0}</td>
          <td class="muted">${escapeHtml(it.date||'')}</td>
          <td class="source">${srcCell}</td>
        </tr>`;
      }).join('');
    }

    function renderBar(items){
      const ctx=document.getElementById('bar');
      if(!ctx) return;
      const top=items.slice(0,7);
      if(barChart){barChart.destroy();barChart=null;}
      if(!top.length){
        return;
      }
      const labels=top.map((x,i)=>{
        const text=safeText(x.title);
        return `${i+1}. ${text.slice(0,20)}${text.length>20?'…':''}`;
      });
      const data=top.map(x=>x.stars||0);
      const colors=top.map((_,i)=>i<3?['#ef4444','#f59e0b','#22c55e'][i]:COLORS[i%COLORS.length]);
      barChart=new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'スコア',data,backgroundColor:colors,borderRadius:8}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{title:(context)=>`${context[0].label}`,label:(context)=>{const idx=context.dataIndex;const item=top[idx];return `スコア: ${context.parsed.y} | カテゴリ: ${item.category||'不明'}`;}}}},scales:{x:{ticks:{maxRotation:45,minRotation:0}},y:{beginAtZero:true,title:{display:true,text:'スコア'}}}}});
    }

    async function loadAndRender(url,onCategoryChange){
      if(!url) return;
      try{
        const res=await fetch(url,{cache:'no-store'});
        if(!res.ok) throw new Error(`fetch failed: ${res.status}`);
        const json=await res.json();
        const items=extractItems(json).sort(byStarsDesc);
        const categories=[...new Set(items.map(it=>it.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
        ensureCategoryFilters(categories,onCategoryChange);
        const selected=getSelectedCategories();
        const filtered=selected.length?items.filter(it=>selected.includes(it.category)):items;
        renderMeta(json,{totalItems:items.length,filteredItems:filtered.length,categoryCount:categories.length},url);
        renderHighlight(filtered);
        renderTable(filtered);
        renderBar(filtered);
      }catch(e){
        console.error('loadAndRender error',e);
        const metaEl=document.getElementById('meta');
        if(metaEl) metaEl.textContent='';
        document.getElementById('highlight').textContent='データの読み込みに失敗しました。ファイルの存在とCORS設定を確認してください。';
        document.getElementById('rows').innerHTML='';
        if(barChart){barChart.destroy();barChart=null;}
      }
    }

    async function populateDataSources(select){
      if(!select) return '';
      const added=new Set();
      select.innerHTML='';

      const addOption=(value,label,meta={})=>{
        if(!value||added.has(value)) return;
        const option=document.createElement('option');
        option.value=value;
        option.textContent=label;
        select.appendChild(option);
        added.add(value);
        SOURCE_META.set(value,{...meta,label});
      };

      let hasDaily=false;
      try{
        const res=await fetch(`${DATA_BASE_URL}daily_index.json`,{cache:'no-store'});
        if(res.ok){
          const dailyList=await res.json();
          if(Array.isArray(dailyList)&&dailyList.length){
            dailyList.sort((a,b)=>safeText(b.date).localeCompare(safeText(a.date)));
            dailyList.slice(0,14).forEach((entry,index)=>{
              if(!entry?.file) return;
              const countText=typeof entry.count==='number'?`${entry.count}件`:'件数不明';
              const label=index===0?`📰 Daily AI News 最新（${entry.date} / ${countText}）`:`📰 Daily AI News ${entry.date}（${countText}）`;
              addOption(`${DATA_BASE_URL}${entry.file}`,label,{type:'daily',date:entry.date,count:entry.count,source:entry.source});
            });
            hasDaily=true;
          }
        }
      }catch(err){
        console.warn('daily_index fetch failed',err);
      }
      if(!hasDaily){
        const fallbackDaily=FALLBACK_SOURCES.find(opt=>opt.meta?.type==='daily');
        if(fallbackDaily) addOption(fallbackDaily.value,fallbackDaily.label,fallbackDaily.meta);
      }

      let hasArchive=false;
      try{
        const res=await fetch(`${DATA_BASE_URL}archive_index.json`,{cache:'no-store'});
        if(res.ok){
          const archiveList=await res.json();
          if(Array.isArray(archiveList)&&archiveList.length){
            archiveList.forEach(entry=>{
              if(!entry?.file) return;
              const isGithub=(entry.source||'').toLowerCase().includes('github');
              const count=entry.count??entry.items??null;
              const countText=typeof count==='number'?`${count}件`:'件数不明';
              const label=isGithub?`📦 GitHub統合データ（${countText}）`:`🗂️ ${entry.date}（${countText}）`;
              addOption(`${DATA_BASE_URL}${entry.file}`,label,{type:isGithub?'github':'archive',date:entry.date,count:count,source:entry.source});
            });
            hasArchive=true;
          }
        }
      }catch(err){
        console.warn('archive_index fetch failed',err);
      }

      if(!hasArchive){
        FALLBACK_SOURCES.filter(opt=>opt.meta?.type!=='daily').forEach(opt=>addOption(opt.value,opt.label,opt.meta));
      }

      if(select.options.length){
        select.selectedIndex=0;
        return select.value;
      }
      const placeholder=document.createElement('option');
      placeholder.value='';
      placeholder.textContent='データソースなし';
      placeholder.disabled=true;
      placeholder.selected=true;
      select.appendChild(placeholder);
      return '';
    }

    document.addEventListener('DOMContentLoaded',async()=>{
      const sel=document.getElementById('dataSource');
      const reload=()=>{
        if(sel.value){
          loadAndRender(sel.value,reload);
        }
      };
      const initial=await populateDataSources(sel);
      attachCategoryListeners(reload);
      sel.addEventListener('change',reload);
      if(initial){
        reload();
      }else{
        document.getElementById('highlight').textContent='利用可能なデータソースが見つかりませんでした。';
      }
    });
  </script>

</body>
</html>
