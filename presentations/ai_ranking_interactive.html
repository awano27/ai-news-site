<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIニュース アーカイブ検索 | AI Intelligence Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <style>
    :root{--bg:#f8fafc;--fg:#0f172a;--accent:#3b82f6;--border:#e2e8f0;--muted:#64748b;--ok:#10b981}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    .header{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
    .header h1{margin:0 0 6px 0;font-size:22px}
    .header .desc{color:var(--muted);font-size:14px}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .controls select,.controls input[type="checkbox"]{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
    .layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}
    .card h2{margin:0 0 10px 0;font-size:16px}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid var(--border);padding:8px;text-align:left;font-size:14px}
    th{font-weight:800}
    .pill{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800}
    .muted{color:var(--muted)}
    .source a{color:var(--accent);text-decoration:none}
    .source a:hover{text-decoration:underline}
    @media (max-width:960px){.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔍 AIニュース アーカイブ検索</h1>
      <div class="desc">
        過去のAIニュースアーカイブを検索・閲覧できます。
        データソースを切り替えて、Daily AI News（最新36件）、日付別、またはGitHub統合データ（427件）から情報を探索できます。
        カテゴリフィルターで絞り込みも可能です。
      </div>
      <div class="controls">
        <label>データソース:
          <select id="dataSource">
            <option value="https://awano27.github.io/ai-news-site/public-pages/news/2025-10-26_daily.json" selected>📰 Daily AI News（最新36件）</option>
            <option value="https://awano27.github.io/ai-news-site/public-pages/news/2025-09-13_github.json">GitHub統合データ（427件）</option>
            <option value="https://awano27.github.io/ai-news-site/public-pages/news/2025-09-13.json">2025-09-13</option>
            <option value="https://awano27.github.io/ai-news-site/public-pages/news/2025-09-12.json">2025-09-12</option>
            <option value="https://awano27.github.io/ai-news-site/public-pages/news/2025-09-07.json">2025-09-07</option>
          </select>
        </label>
        <label><input type="checkbox" class="cat" value="テクノロジー・ツール" checked> テクノロジー・ツール</label>
        <label><input type="checkbox" class="cat" value="ビジネス・投資" checked> ビジネス・投資</label>
        <label><input type="checkbox" class="cat" value="SNS・論文" checked> SNS・論文</label>
        <label><input type="checkbox" class="cat" value="AI Technology" checked> AI Technology</label>
      </div>
      <div class="desc" id="meta"></div>
    </div>

    <div class="layout">
      <div class="card">
        <h2>上位トピック（棒グラフ）</h2>
        <canvas id="bar"></canvas>
      </div>
      <div class="card">
        <h2>ハイライト</h2>
        <div id="highlight" class="muted">読み込み中…</div>
      </div>
      <div class="card" style="grid-column:1/-1">
        <h2>アーカイブ一覧</h2>
        <table>
          <thead>
            <tr><th>No.</th><th>タイトル</th><th>カテゴリ</th><th>重要度</th><th>日付</th><th>ソース</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const COLORS=['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#0ea5e9','#84cc16'];
    let barChart=null;

    function byStarsDesc(a,b){return (b.stars||0)-(a.stars||0)}
    function sanitize(s){return (s||'').toString()}

    function extractItems(data, cats){
      const items=[];

      // 動的スコアリング関数
      function calculateScore(item, index) {
        // 基本スコア（元のスコアがある場合はそれを使用）
        let score = item.score || item.importance_score || item.stars || 0;

        // スコアが0または同じ値ばかりの場合、代替スコアリング
        if (score === 0) {
          // タイトルの長さベース（情報量推定）
          const titleLength = (item.title || '').length;
          score += Math.floor(titleLength / 10);

          // カテゴリ重要度
          const categoryWeights = {
            'AI Technology': 95,
            'テクノロジー・ツール': 85,
            'ビジネス・投資': 75,
            'SNS・論文': 65
          };
          score += categoryWeights[item.category] || 50;

          // ランダム要素で差別化（同じスコアを避ける）
          score += Math.floor(Math.random() * 20) + index % 10;
        }

        return Math.max(score, 1);
      }

      // Daily AI News形式の場合（articles配列）
      if(data.articles && Array.isArray(data.articles)){
        // カテゴリマッピング（Daily AI Newsのカテゴリ→既存カテゴリ）
        const catMap = {
          'business': 'ビジネス・投資',
          'tools': 'テクノロジー・ツール',
          'posts': 'SNS・論文'
        };

        data.articles.forEach((it, index) => {
          const mappedCat = catMap[it.category] || it.category;
          if(!cats.length || cats.includes(mappedCat)){
            items.push({
              date: it.published_at || '',
              title: sanitize(it.title),
              stars: it.score || calculateScore(it, index),
              category: sanitize(mappedCat),
              source: {
                name: it.source || 'ソース',
                url: it.url
              }
            });
          }
        });
      }

      // GitHub統合データの場合（raw_github_data配列）
      else if(data.raw_github_data && Array.isArray(data.raw_github_data)){
        data.raw_github_data.forEach((it, index) => {
          if(!cats.length || cats.includes(it.category)){
            items.push({
              date: it.timestamp||data.date||'',
              title: sanitize(it.title),
              stars: calculateScore(it, index),
              category: sanitize(it.category||'Other'),
              source: {
                name: it.source || 'ソース',
                url: it.url
              }
            });
          }
        });
      }

      // 通常のアーカイブ形式の場合（items配列）
      else if(data.items && Array.isArray(data.items)){
        data.items.forEach((it, index) => {
          if(!cats.length || cats.includes(it.category)){
            items.push({
              date: it.date||data.date||'',
              title: sanitize(it.title),
              stars: calculateScore(it, index),
              category: sanitize(it.category||'Other'),
              source: {
                name: it.url ? 'リンク' : 'ソース',
                url: it.url
              }
            });
          }
        });
      }

      // 従来のsections形式の場合
      else if(data.sections){
        let globalIndex = 0;
        for(const cat of cats){
          (data.sections[cat]||[]).forEach((it, localIndex) => {
            items.push({
              date: it.date||'',
              title: sanitize(it.title),
              stars: calculateScore({...it, category: cat}, globalIndex + localIndex),
              category: cat,
              source: it.source||{}
            });
            globalIndex++;
          });
        }
      }

      return items;
    }

    function renderMeta(data){
      const el=document.getElementById('meta');
      const parts=[];
      if(data.date) parts.push(`日付: ${data.date}`);
      if(data.count) parts.push(`件数: ${data.count}件`);
      if(data.generated_at) parts.push(`生成: ${data.generated_at}`);
      if(data.source && data.source.includes('GitHub')) parts.push('ソース: GitHub統合');
      if(data.raw_github_data) parts.push(`GitHub統合データ: ${data.raw_github_data.length}件`);
      el.textContent = parts.join(' | ');
    }

    function renderHighlight(items){
      const el=document.getElementById('highlight');
      if(!items || !items.length){ 
        el.textContent='ハイライト項目はありません。'; 
        return; 
      }
      
      // 最高スコアのアイテムをハイライトとして表示
      const top = items[0];
      const title = sanitize(top.title);
      const summary = sanitize(top.summary || `スコア: ${top.stars}`);
      const linkHtml = top.source?.url ? 
        `<a href="${top.source.url}" target="_blank" rel="noopener">${sanitize(top.source.name||'リンク')}</a>` : '';
      
      el.innerHTML = `
        <div style="margin-bottom:6px"><span class="pill">${sanitize(top.category||'top')}</span> <strong>${title}</strong></div>
        <div class="muted" style="margin-bottom:6px">${summary}</div>
        <div class="source">${linkHtml}</div>
      `;
    }

    function renderTable(items){
      const tbody=document.getElementById('rows');
      tbody.innerHTML= items.map((it, index)=>{
        const srcName = sanitize(it.source?.name);
        const srcUrl  = it.source?.url ? `<a href="${it.source.url}" target="_blank" rel="noopener">${srcName||'リンク'}</a>` : 'ソース不明';
        const rank = index + 1;
        const rankBadge = rank <= 3 ?
          `<span class="pill" style="background:${rank===1?'#ef4444':rank===2?'#f59e0b':'#22c55e'}">${rank}</span>` :
          `<span style="font-weight:800">${rank}</span>`;

        return `<tr>
          <td>${rankBadge}</td>
          <td><strong>${sanitize(it.title)}</strong></td>
          <td><span class="pill" style="font-size:11px">${sanitize(it.category)}</span></td>
          <td style="font-weight:800; color:var(--accent)">${it.stars||0}</td>
          <td class="muted">${sanitize(it.date)}</td>
          <td class="source">${srcUrl}</td>
        </tr>`
      }).join('');
    }

    function renderBar(items){
      const ctx=document.getElementById('bar');
      const top=items.slice(0,7);
      const labels=top.map((x, i)=>`${i+1}. ${x.title.slice(0,20)+(x.title.length>20?'…':'')}`);
      const data=top.map(x=>x.stars||0);
      const colors=top.map((x,i)=>i<3?['#ef4444','#f59e0b','#22c55e'][i]:COLORS[i]);
      if(barChart){barChart.destroy()}
      barChart=new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'スコア',data,backgroundColor:colors,borderRadius:8}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{title:(c)=>`${c[0].label}`,label:(c)=>`スコア: ${c.parsed.y} | カテゴリ: ${top[c.dataIndex].category}`}}},scales:{x:{ticks:{maxRotation:45}},y:{beginAtZero:true,title:{display:true,text:'スコア'}}}}});
    }

    async function loadAndRender(url){
      try{
        const res=await fetch(url,{cache:'no-store'});
        if(!res.ok) throw new Error('fetch failed');
        const json=await res.json();
        renderMeta(json);
        const cats=[...document.querySelectorAll('.cat:checked')].map(x=>x.value);
        const items=extractItems(json, cats).sort(byStarsDesc);
        renderHighlight(items);
        renderTable(items);
        renderBar(items);
      }catch(e){
        document.getElementById('highlight').textContent='データの読み込みに失敗しました。ファイルの存在とCORS設定を確認してください。';
        document.getElementById('rows').innerHTML='';
        if(barChart){barChart.destroy();}
      }
    }

    document.addEventListener('DOMContentLoaded',()=>{
      const sel=document.getElementById('dataSource');
      const reload=()=>loadAndRender(sel.value);
      sel.addEventListener('change',reload);
      document.querySelectorAll('.cat').forEach(cb=>cb.addEventListener('change',reload));
      reload();
    });
  </script>
</body>
</html>
