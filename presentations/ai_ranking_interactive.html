<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI News Ranking - インタラクティブ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <script src="assets/xai-init.js" defer></script>
  <style>
    :root{--bg:#f8fafc;--fg:#0f172a;--accent:#3b82f6;--border:#e2e8f0}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    .header{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 style="margin:0">AI News Ranking（Safe Mode）</h1>
      <div style="color:#64748b">簡易表示中：主要チャートのみを表示します。</div>
    </div>
    <div class="grid">
      <div class="card">
        <canvas id="bar"></canvas>
      </div>
      <div class="card">
        <canvas id="line"></canvas>
      </div>
    </div>
  </div>
  <script>
    const COLORS=['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6'];
    function makeBar(){
      const ctx=document.getElementById('bar');
      new Chart(ctx,{type:'bar',data:{labels:['Model A','Model B','Model C','Model D','Model E'],datasets:[{label:'Impact',data:[92,88,85,83,80],backgroundColor:COLORS}]},options:{plugins:{legend:{display:false}},scales:{y:{min:70,max:100}}}});
    }
    function makeLine(){
      const ctx=document.getElementById('line');
      new Chart(ctx,{type:'line',data:{labels:['7/30','8/1','8/2','8/3','8/4','8/5','8/6'],datasets:[{label:'Score',data:[92,88,88,85,83,94,85],borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,0.12)',fill:true,tension:0.35}]},options:{plugins:{legend:{display:false}},scales:{y:{min:70,max:100}}}});
    }
    document.addEventListener('DOMContentLoaded',()=>{makeBar();makeLine();});
  </script>
</body>
</html>
