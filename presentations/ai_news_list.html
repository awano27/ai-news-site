<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily AI News - List</title>
  <style>
    :root { --bg:#0b0f14; --surface:#10161d; --text:#e6edf3; --muted:#8aa0b2; --border:#1b2530; --accent:#67e8f9; --ok:#22d3ee; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans JP', sans-serif; }
    .mast { background: linear-gradient(180deg,#0b0f14 0%,#0a0e13 100%); color:#dbe5ec; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; backdrop-filter: blur(6px); }
    .mast .inner { max-width:1200px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
    .mast .brand { font-weight:900; letter-spacing:.04em; text-transform: uppercase; font-size:14px; }
    .mast .nav a { color:var(--accent); text-decoration:none; margin-left:16px; font-weight:800; font-size:13px; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px 24px; }
    .header { padding:22px 0 10px; border-bottom:1px solid var(--border); }
    .header h1 { margin:12px 0 6px; font-size:26px; font-weight:900; letter-spacing:.02em; }
    .header p { margin: 0; color: var(--muted); }
    .controls { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: end; margin: 14px 0 8px; }
    @media (max-width: 800px) { .controls { grid-template-columns: 1fr; } }
    .field { display: grid; gap: 6px; }
    .label { font-size: 12px; color: var(--muted); }
    input[type="search"], select { border: 2px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px; padding: 10px 12px; }
    .range { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
    input[type="range"] { width: 180px; }
    .count { color: var(--muted); font-weight: 700; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
    .chip { border:1px solid var(--border); background:transparent; color:var(--muted); padding:6px 10px; border-radius:9999px; font-weight:800; cursor:pointer; }
    .chip.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px rgba(103,232,249,.15); }
    .featured { display:grid; grid-template-columns: 1.15fr 1fr; gap:16px; margin-top: 10px; }
    @media (max-width: 900px) { .featured { grid-template-columns: 1fr; } }
    .hero { position:relative; background: var(--surface); border:1px solid var(--border); border-radius: 14px; padding:18px; box-shadow: 0 12px 26px rgba(0,0,0,.06); }
    .hero .score { position: absolute; top: 12px; right: 12px; background: var(--accent); color: #0b0f14; font-weight: 900; border-radius: 9999px; padding: 6px 10px; }
    .hero .title { font-size: 22px; font-weight: 900; margin: 4px 0 8px; }
    .hero .kicker { color: var(--accent); font-weight:800; font-size:12px; letter-spacing:.06em; }
    .hero .summary { color: var(--muted); line-height:1.7; margin-top: 8px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:16px; margin-top:16px; }
    @media (max-width: 900px) { .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:16px; margin-top:16px; } }
    .card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.25); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.35); border-color:#263241; }
    .score { position: absolute; top: 12px; right: 12px; background: var(--accent); color: #0b0f14; font-weight: 900; border-radius: 9999px; padding: 6px 10px; }
    .title { font-size: 18px; font-weight: 900; margin: 4px 0 6px; }
    .meta { display:flex; gap:10px; flex-wrap:wrap; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .summary { color: var(--muted); line-height: 1.6; }
    .actions { margin-top: 10px; display:flex; gap:10px; align-items:center; }
    .btn { appearance: none; border: 1px solid var(--border); background: var(--surface); padding: 8px 10px; border-radius: 10px; color: var(--accent); font-weight: 800; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }

    /* Thumbnails (generated SVGs) */
    .thumb { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; display: block; background: #eceff3; }
    .hero .thumb { aspect-ratio: 16 / 8; border-radius: 14px; margin-bottom: 10px; }
    .card .thumb { margin-bottom: 8px; }

    /* Info-dense enhancements */
    .meta .favicon { width:16px; height:16px; border-radius:4px; vertical-align:-3px; }
    .label-pill { display:inline-block; padding:4px 8px; border-radius:9999px; font-weight:800; font-size:12px; margin-left:6px; }
    .label-must { background:#ef4444; color:#fff; }
    .label-rec { background:#f59e0b; color:#111; }
    .label-consid { background:#10b981; color:#fff; }
    .points { margin-top:8px; font-size:13px; color:var(--muted); }
    .points li { margin-left: 1em; list-style: disc; }

    /* Compact density */
    .density { margin-left:auto; }
    .density .btn { padding:6px 10px; }
    .compact .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:16px; margin-top:16px; }
    @media (max-width: 1100px) { .compact .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:16px; margin-top:16px; } }
    .compact .card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.25); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  </style>
<script src="assets/xai-init.js" defer></script>
</head>
<body>
  <header class="mast">
    <div class="inner">
      <div class="brand">Daily AI News</div>
      <nav class="nav"><a href="./">Presentations</a><a href="daily_ai_news_report_latest.html">Report</a></nav>
    </div>
  </header>
  <div class="wrap">
    <div class="header">
      <h1>Daily AI News</h1>
      <p>繧ｹ繧ｳ繧｢鬆・〒荳ｻ縺縺｣縺溘ル繝･繝ｼ繧ｹ繧偵ワ繧､繝ｩ繧､繝医よ､懃ｴ｢繝ｻ繧ｹ繧ｳ繧｢蟶ｯ繝ｻ繝ｩ繝吶Ν縺ｧ邨槭ｊ霎ｼ縺ｿ縺ｧ縺阪∪縺吶・/p>
    </div>
    <div class="controls">
      <label class="field">
        <span class="label">讀懃ｴ｢</span>
        <input id="q" type="search" placeholder="繧ｿ繧､繝医Ν繝ｻ隕∫ｴ・〒讀懃ｴ｢" />
      </label>
      <label class="field range">
        <span class="label">譛菴弱せ繧ｳ繧｢</span>
        <input id="min" type="range" min="0" max="100" step="5" value="0" />
        <output id="minVal">0</output>
      </label>
      <div class="count"><span id="cnt">0</span> 莉ｶ</div>
      <div class="density"><button id="densityToggle" class="btn" type="button">蟇・ｺｦ: 讓呎ｺ・/button></div>
    </div>
    <div class="chips" role="tablist" aria-label="繧ｹ繧ｳ繧｢蟶ｯ">
      <button class="chip active" data-band="all" role="tab" aria-selected="true">縺吶∋縺ｦ</button>
      <button class="chip" data-band="90">90+</button>
      <button class="chip" data-band="80">80+</button>
      <button class="chip" data-band="70">70+</button>
      <button class="chip" data-band="must">蠢・ｪｭ</button>
      <button class="chip" data-band="rec">豕ｨ逶ｮ</button>
      <button class="chip" data-band="consid">蜿り・/button>
    </div>
    <section id="featured" class="featured" hidden>
      <article class="hero" id="hero-main"></article>
      <article class="hero" id="hero-side"></article>
    </section>
    <div id="list" class="grid" aria-live="polite"></div>
    <div id="empty" class="empty" hidden>隧ｲ蠖薙☆繧九ル繝･繝ｼ繧ｹ縺後≠繧翫∪縺帙ｓ縲・/div>
  </div>

  <script>
  const SRC = 'daily_ai_news_report_latest.html';
  const state = { items: [], filtered: [], q: '', min: 0, band: 'all' };
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

  function escapeHtml(t){ const d=document.createElement('div'); d.textContent=t??''; return d.innerHTML; }
  function domain(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
  function relTime(s){ if(!s) return ""; const d=new Date(s); if(isNaN(d)) return s; const diff=(Date.now()-d)/1000; if(diff<3600) return `${Math.floor(diff/60)}m ago`; if(diff<86400) return `${Math.floor(diff/3600)}h ago`; return d.toISOString().slice(0,10); }蛻・燕`; if(diff<86400) return `${Math.floor(diff/3600)}譎る俣蜑港; return d.toLocaleDateString('ja-JP'); }
  function labelFor(score){ if(score>=90) return 'must'; if(score>=80) return 'rec'; if(score>=70) return 'consid'; return ''; }
  function labelName(lbl){ return lbl==='must'?'蠢・ｪｭ':lbl==='rec'?'豕ｨ逶ｮ':lbl==='consid'?'蜿り・:''; }

  // Deterministic gradient + overlay text -> SVG data URL
  function hash32(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  function paletteFrom(key){ const h = hash32(key) % 360; const h2 = (h + 35 + (key.length%20)) % 360; return [`hsl(${h} 75% 58%)`,`hsl(${h2} 72% 54%)`]; }
  function svgEscapeText(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function makeThumbData(it, w, h){
    const key = domain(it.url) || it.title || 'news';
    const [c1,c2] = paletteFrom(key);
    const title = svgEscapeText((it.title||'').slice(0,36));
    const dom = svgEscapeText(domain(it.url)||'');
    const score = (it.score||0);
    const lbl = labelName(it.label||labelFor(score));
    const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'>
  <defs>
    <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='${c1}' />
      <stop offset='100%' stop-color='${c2}' />
    </linearGradient>
    <filter id='s' x='-10%' y='-10%' width='120%' height='120%'>
      <feDropShadow dx='0' dy='3' stdDeviation='6' flood-opacity='.25' />
    </filter>
  </defs>
  <rect x='0' y='0' width='${w}' height='${h}' fill='url(#g)'/>
  <g filter='url(#s)'>
    <rect x='16' y='16' rx='10' ry='10' width='${w-32}' height='${h-32}' fill='rgba(255,255,255,0.12)' />
  </g>
  <text x='28' y='${Math.round(h*0.45)}' font-family='Segoe UI, Arial, sans-serif' font-weight='900' font-size='${Math.max(20,Math.round(w*0.05))}' fill='#ffffff'>${title}</text>
  <text x='28' y='${Math.round(h*0.65)}' font-family='Segoe UI, Arial, sans-serif' font-weight='700' font-size='${Math.max(12,Math.round(w*0.035))}' fill='rgba(255,255,255,0.9)'>${dom}</text>
  <g>
    <circle cx='${w-56}' cy='40' r='22' fill='rgba(255,255,255,0.95)' />
    <text x='${w-56}' y='46' text-anchor='middle' font-family='Segoe UI, Arial, sans-serif' font-weight='900' font-size='18' fill='${c2}'>${score}</text>
  </g>
  ${lbl?`<g>
    <rect x='28' y='${Math.round(h*0.7)}' rx='8' ry='8' width='92' height='24' fill='rgba(0,0,0,0.35)' />
    <text x='74' y='${Math.round(h*0.7)+17}' text-anchor='middle' font-family='Segoe UI, Arial, sans-serif' font-weight='800' font-size='12' fill='#fff'>${svgEscapeText(lbl)}</text>
  </g>`:''}
</svg>`;
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }

  function parseItems(html){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const rows = Array.from(doc.querySelectorAll('.news-item'));
    const items = rows.map((row, idx) => {
      const title = row.querySelector('.news-title')?.textContent?.trim() || '';
      const score = parseInt(row.querySelector('.news-score')?.textContent || '0', 10) || 0;
      const rank = parseInt(row.querySelector('.news-rank')?.textContent || String(idx+1), 10) || (idx+1);
      let url = '';
      const metaText = row.querySelector('.news-meta')?.textContent || '';
      const m = metaText.match(/URL\s*=\s*([^,\s]+)/);
      if (m) url = m[1];
      let date = '';
      const md = metaText.match(/謚慕ｨｿ譌･=([^,]+)/);
      if (md) date = md[1].trim();
      let summary = '';
      const pAfter = row.querySelector('p');
      if (pAfter) summary = pAfter.textContent.trim();
      const points = Array.from(row.querySelectorAll('ul li')).slice(0,3).map(li=>li.textContent.trim()).filter(Boolean);
      const label = labelFor(score);
      return { title, score, rank, url, summary, date, points, label };
    });
    return items.sort((a,b)=> b.score - a.score || a.rank - b.rank);
  }

  function heroHTML(it){
    const dom = domain(it.url);
    const sum = it.summary ? escapeHtml(it.summary.slice(0,220)) + (it.summary.length>220?'窶ｦ':'') : '';
    return `
      <img class="thumb" src="${makeThumbData(it, 800, 400)}" alt="">
      <div class="score">${it.score}</div>
      <div class="kicker">${dom ? dom : 'featured'}</div>
      <h3 class="title">${escapeHtml(it.title)}</h3>
      <div class="meta"><span>${it.date? relTime(it.date): ''}</span><span>鬆・ｽ・ ${it.rank}</span></div>
      ${sum ? `<div class="summary">${sum}</div>`:''}
      ${it.points && it.points.length ? `<ul class="points">${it.points.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>`:''}
      <div class="actions"><a class="btn" href="${it.url}" target="_blank" rel="noopener">隱ｭ繧 竊・/a><a class="btn" href="${SRC}" target="_blank" rel="noopener">隧ｳ邏ｰ</a></div>
    `;
  }

  function cardHTML(it){
    const dom = domain(it.url);
    const sum = it.summary ? escapeHtml(it.summary.slice(0,160)) + (it.summary.length>160?'窶ｦ':'') : '';
    return `
      <article class="card">
        <img class="thumb" src="${makeThumbData(it, 640, 360)}" alt="">
        <div class="score">${it.score}</div>
        <h3 class="title">${escapeHtml(it.title)} ${it.label?`<span class="label-pill label-${it.label}">${labelName(it.label)}</span>`:''}</h3>
        <div class="meta">${dom?`<img class="favicon" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(dom)}&sz=32" alt=""> <span>${dom}</span>`:''}<span>${it.date? relTime(it.date): ''}</span><span>鬆・ｽ・${it.rank}</span></div>
        ${sum?`<div class="summary">${sum}</div>`:''}
        ${it.points && it.points.length ? `<ul class="points">${it.points.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>`:''}
        <div class="actions">${it.url?`<a class="btn" href="${it.url}" target="_blank" rel="noopener">髢九￥ 竊・/a>`:''}<a class="btn" href="${SRC}" target="_blank" rel="noopener">隧ｳ邏ｰ繝ｬ繝昴・繝・/a></div>
      </article>`;
  }

  function render(){
    const list = $('#list');
    const empty = $('#empty');
    const feat = state.filtered.slice(0,2);
    const featWrap = $('#featured');
    if (feat.length) {
      featWrap.hidden = false;
      $('#hero-main').innerHTML = heroHTML(feat[0]);
      $('#hero-side').innerHTML = feat[1] ? heroHTML(feat[1]) : '';
    } else {
      featWrap.hidden = true;
    }
    const rest = state.filtered.slice(2);
    list.innerHTML = rest.map(cardHTML).join('');
    $('#cnt').textContent = String(state.filtered.length);
    empty.hidden = state.filtered.length !== 0;
  }

  function applyFilters(){
    const q = state.q.trim().toLowerCase();
    const min = state.min;
    const band = state.band;
    state.filtered = state.items.filter(it => {
      if (it.score < min) return false;
      if (band !== 'all') {
        const b = parseInt(band,10);
        if (isFinite(b)) { if (it.score < b) return false; }
        else { if (it.label !== band) return false; }
      }
      if (q) {
        const text = `${it.title}\n${it.summary}`.toLowerCase();
        if (!text.includes(q)) return false;
      }
      return true;
    });
    render();
  }

  async function init(){
    try {
      const res = await fetch(SRC, { cache: 'no-store' });
      const html = await res.text();
      state.items = parseItems(html);
      state.filtered = [...state.items];
      render();
    } catch (e) {
      console.error('Failed to load source', e);
    }
    const q = $('#q'); const r = $('#min'); const rv = $('#minVal');
    q.addEventListener('input', ()=>{ state.q = q.value || ''; applyFilters(); });
    const upd = ()=>{ state.min = parseInt(r.value||'0',10); rv.value = String(state.min); applyFilters(); };
    r.addEventListener('input', upd); upd();
    $$('.chip').forEach(ch => ch.addEventListener('click', ()=>{ $$('.chip').forEach(c=>c.classList.toggle('active', c===ch)); state.band = ch.dataset.band || 'all'; applyFilters(); }));
    const densityBtn = document.getElementById('densityToggle');
    densityBtn.addEventListener('click', ()=>{
      const body = document.body; const compact = body.classList.toggle('compact');
      densityBtn.textContent = compact ? "Density: Dense" : "Density: Normal";
    });
  }

  document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
