name: Auto Daily Report — Safety Net

# GitHub schedules are best effort. These later checks verify actual publication,
# never promise an exact delivery time, and reserve at most two retries per JST day.
on:
  schedule:
    - cron: '30 2 * * *' # 11:30 JST
    - cron: '0 4 * * *'  # 13:00 JST
  workflow_dispatch: {}

concurrency:
  group: auto-daily-report-safety
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  check-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      NVIDIA_PRODUCTION_USE_CONFIRMED: ${{ vars.NVIDIA_PRODUCTION_USE_CONFIRMED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify today's public Japanese publication
        id: publication
        run: |
          if python scripts/check_daily_publication.py --base-url https://visionhub.jp --date "$(date +%F)" --require-quality; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Today's linked quality-verified publication is unavailable. Recovery eligibility will be checked."
          fi
      - name: Plan bounded recovery
        if: steps.publication.outputs.healthy != 'true'
        id: recovery
        run: python scripts/daily_recovery.py --kind primary --plan
      - name: Reserve this attempt before dispatch
        if: steps.recovery.outputs.dispatch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.recovery.outputs.reservation_name }}
          path: daily-recovery-state/reservation.json
          if-no-files-found: error
          retention-days: 3
      - name: Dispatch bounded recovery
        if: steps.recovery.outputs.dispatch == 'true'
        run: python scripts/daily_recovery.py --kind primary --dispatch
