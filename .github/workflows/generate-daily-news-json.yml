name: Generate Daily News JSON

on:
  # 毎日日本時間 9:00 に実行 (UTC 0:00)
  schedule:
    - cron: '0 0 * * *'

  # 手動実行も可能
  workflow_dispatch:

  # input/day/ 配下のファイルが更新されたときも実行
  push:
    paths:
      - 'input/day/*.txt'
    branches:
      - main

jobs:
  generate-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Daily News JSON
        run: |
          node scripts/generate-daily-news-json.js

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet presentations/api/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add presentations/api/
          git commit -m "Update Daily News JSON (automated)

          Generated at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          🤖 Generated by GitHub Actions"
          git push

      - name: Summary
        run: |
          echo "## Daily News JSON Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.changed }}" = "true" ]; then
            echo "✅ JSON files updated and committed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes detected" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated files:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`presentations/api/daily-news.json\` (全データ)" >> $GITHUB_STEP_SUMMARY
          echo "- \`presentations/api/daily-news-latest.json\` (最新10件)" >> $GITHUB_STEP_SUMMARY
