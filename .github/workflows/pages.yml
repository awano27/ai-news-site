name: Deploy to GitHub Pages
run-name: Deploy Pages @ ${{ inputs.ref || github.sha }}

# Triggers on push to main, plus manual dispatch and a daily safety-net
# cron (08:00 UTC = 17:00 JST) so the live site self-heals once a day
# even if an external workflow partially broke it.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA to package and deploy
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA validated by the caller
        required: true
        type: string
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    outputs:
      source_sha: ${{ steps.revision.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full checkout. The previous sparse-checkout excluded assets/,
      # about.html, contact.html, privacy-policy.html, credits.html,
      # 404.html, ads.txt, robots.txt, sitemap.xml, config/, CNAME,
      # and ai-news-site/ — which caused periodic 404s every time a
      # data-only workflow auto-committed news JSON.
      - name: Checkout (full tree)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check corrected technical claims before packaging
        # Static guard only: warnings still need editorial source review.
        # No vendor fetches or model API calls run in this step.
        run: python scripts/check_coding_guide_integrity.py

      - name: Check evidence records on migrated pages
        # Offline structure/consistency check for the initial migration only.
        # Legacy articles without metadata and external link outages are not gates.
        run: python scripts/check_claim_evidence.py

      - name: Build public artifact at the checked-out revision
        id: revision
        run: |
          node scripts/build-homepage-latest.js
          python scripts/build_sitemap.py
          python scripts/inject_analytics.py
          DEPLOY_SHA=$(git rev-parse HEAD)
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          DEPLOY_SHA="$DEPLOY_SHA" python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("deployment-revision.json").write_text(
              json.dumps({"sha": os.environ["DEPLOY_SHA"]}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate generated public artifact
        run: |
          python scripts/check_site_freshness.py
          python scripts/check_analytics_config.py
          python scripts/check_analytics_coverage.py

      - name: Strip server-side / dev-only paths before deploy
        # Keep the artifact small + avoid leaking local helpers to the CDN.
        run: |
          if [ -f input/day/0514.pdf ]; then
            mkdir -p .deploy-keep/input/day
            cp input/day/0514.pdf .deploy-keep/input/day/0514.pdf
          fi
          rm -rf \
            __pycache__ \
            backup_untracked \
            input \
            script \
            scripts \
            src \
            tests \
            tools \
            frontend \
            data/__pycache__ \
            docs/plans \
            .worktrees \
            logs \
            reports \
            test-results \
            _review_output \
            .venv \
            venv \
            node_modules \
            .playwright-mcp \
            tmp_* \
            tmpclaude-* \
            *.pdf \
            *.pptx \
            *.patch \
            *.py \
            *.md \
            requirements*.txt \
            package*.json \
            sources.yaml \
            skills-lock.json \
            vercel.json \
            .gitignore \
            .gitattributes \
            .editorconfig \
            .vercelignore || true
          # Remove large PNG screenshots at repo root (dev captures)
          rm -f index-*.png live-*.png verify-*.png nttdata-*.png \
                antigravity_*.png *.bak *.bak.* || true
          if [ -f .deploy-keep/input/day/0514.pdf ]; then
            mkdir -p input/day
            cp .deploy-keep/input/day/0514.pdf input/day/0514.pdf
            rm -rf .deploy-keep
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      source_sha: ${{ needs.build.outputs.source_sha }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify deployed site responds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, deploy]
    steps:
      - name: Probe deployed URL after publication
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 20 "$PAGE_URL" || true)
            echo "attempt=${attempt} status=${code}"
            if [ "$code" = "200" ]; then
              revision_url="${PAGE_URL%/}/deployment-revision.json?sha=${EXPECTED_SHA}"
              if curl -fsS -L --max-time 20 -H "Cache-Control: no-cache" "$revision_url" -o deployment-revision.json; then
                if EXPECTED_SHA="$EXPECTED_SHA" python - <<'PY'
          import json
          import os
          from pathlib import Path

          revision = json.loads(Path("deployment-revision.json").read_text(encoding="utf-8"))
          raise SystemExit(0 if revision.get("sha") == os.environ["EXPECTED_SHA"] else 1)
          PY
                then
                  echo "deployed revision=${EXPECTED_SHA}"
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "::error::Pages deployment completed but the expected revision was not observable"
          exit 1
