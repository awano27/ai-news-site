name: Deploy to GitHub Pages

# workflow_run explicitly deploys successful bot-generated daily commits.
# Push/manual/cron remain general structural deployments of current main.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: ['Auto Daily Report — Cloud Primary']
    types: [completed]
    branches: [main]
  schedule:
    # 09:15 JST, after the existing 09:00 news JSON update. No extra deploy job.
    - cron: '15 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full checkout. The previous sparse-checkout excluded assets/,
      # about.html, contact.html, privacy-policy.html, credits.html,
      # 404.html, ads.txt, robots.txt, sitemap.xml, config/, CNAME,
      # and ai-news-site/ — which caused periodic 404s every time a
      # data-only workflow auto-committed news JSON.
      - name: Checkout (full tree)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record exact build revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check corrected technical claims before packaging
        # Static guard only: warnings still need editorial source review.
        # No vendor fetches or model API calls run in this step.
        run: python scripts/check_coding_guide_integrity.py

      - name: Check evidence records on migrated pages
        # Offline structure/consistency check for the initial migration only.
        # Legacy articles without metadata and external link outages are not gates.
        run: python scripts/check_claim_evidence.py

      - name: Refresh linked search and homepage, then verify
        env:
          STRICT_DAILY: ${{ github.event_name == 'workflow_run' }}
        run: |
          python scripts/sync_daily_search.py --root .
          python scripts/build_search_index.py --root .
          python scripts/refresh_slide_indexes.py
          node scripts/build-homepage-latest.js --strict
          node scripts/build-homepage-latest.js --strict --check
          python scripts/build_sitemap.py
          REPORT_DATE=$(python -c "import json; print(json.load(open('daily-news/data.json'))['date'])")
          QUALITY_FLAG=()
          if [ "$STRICT_DAILY" = "true" ]; then QUALITY_FLAG+=(--require-quality); fi
          python scripts/check_daily_publication.py --root . --date "$REPORT_DATE" "${QUALITY_FLAG[@]}"

      - name: Stage public site and reject internal paths
        # Copy an allowlist into a clean directory. Daily news, reports, and
        # slides are created inside those directories, so they ship without a
        # second edit. Uploading the repo root exposed tasks/, .claude/, ops/,
        # config/, docs/, and other internal files.
        run: python scripts/stage_pages_site.py --dest "$RUNNER_TEMP/pages-site"

      - name: Record public artifact identity
        env:
          BUILD_REVISION: ${{ steps.revision.outputs.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/pages_revision.py record --root . --site "$RUNNER_TEMP/pages-site" \
            --revision "$BUILD_REVISION" --run-id "$BUILD_RUN_ID"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact published revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.revision }}
      - name: Verify deployed content against the built repository
        env:
          STRICT_DAILY: ${{ github.event_name == 'workflow_run' }}
          BUILD_REVISION: ${{ needs.build.outputs.revision }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          # Pages can serve the previous identity for a few seconds after deploy.
          for attempt in 1 2 3 4 5 6; do
            python scripts/pages_revision.py resolve --base-url https://visionhub.jp \
              --expect-revision "$BUILD_REVISION" --expect-run-id "$BUILD_RUN_ID" && break
            [ "$attempt" = 6 ] && exit 1
            sleep 20
          done
          node scripts/build-homepage-latest.js --strict
          python scripts/check_homepage_sync.py --base-url https://visionhub.jp
          REPORT_DATE=$(python -c "import json; print(json.load(open('daily-news/data.json'))['date'])")
          QUALITY_FLAG=()
          if [ "$STRICT_DAILY" = "true" ]; then QUALITY_FLAG+=(--require-quality); fi
          python scripts/check_daily_publication.py --root . --base-url https://visionhub.jp \
            --date "$REPORT_DATE" --check-urls --attempts 6 --delay 15 "${QUALITY_FLAG[@]}"
