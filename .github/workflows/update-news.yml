name: Update AI News

on:
  schedule:
    - cron: '25 21 * * *'  # Every day 06:25 JST (UTC+9)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-push
  cancel-in-progress: false

jobs:
  build:
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      generated_ref: ${{ steps.commit.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Build news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NEWS_ONLY_SHEETS: '0'
          NEWS_FAST_MODE: '1'
          NEWS_GLOBAL_TIMEOUT_SEC: '45'
        run: |
          python script/build_news.py

      - name: Commit changes
        id: commit
        run: |
          if [ -n "$(git status --porcelain news)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add news
            git commit -m "chore(news): auto update"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/publish-generated-content.yml
    with:
      ref: ${{ needs.build.outputs.generated_ref }}
    permissions:
      contents: read
      pages: write
      id-token: write

