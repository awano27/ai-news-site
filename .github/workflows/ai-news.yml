# .github/workflows/ai-news.yml
name: AI News – daily build

on:
  schedule:
    # JST 08:50（= UTC 23:50）に毎日実行
    - cron: '50 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-push
  cancel-in-progress: false

jobs:
  build:
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      generated_ref: ${{ steps.commit.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Build news JSON
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NEWS_ONLY_SHEETS: '0'
          NEWS_FAST_MODE: '1'
          NEWS_MAX_AGE_HOURS: '48'
          NEWS_GLOBAL_TIMEOUT_SEC: '45'
        run: python script/build_news.py
      - name: Refresh homepage and sitemap
        run: |
          node scripts/build-homepage-latest.js
          python scripts/build_sitemap.py
      - name: Commit & push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/latest.json news/*.json index.html sitemap.xml || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily AI news JSON"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/publish-generated-content.yml
    with:
      ref: ${{ needs.build.outputs.generated_ref }}
    permissions:
      contents: read
      pages: write
      id-token: write
