name: Daily Archive and Build

on:
  schedule:
    # 00:05 JST daily (15:05 UTC)
    - cron: '5 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Removed steps (2026-07): "Extract Daily AI News Pages data"
      # (extract_daily_news.py was lost in April 2026; date-named snapshots
      # now reach daily_index.json via scripts/rebuild-news-indexes.js),
      # "Build advanced report" (advanced_intelligence_report_latest.html was
      # deliberately converted to a redirect in the 2026-06-15 legacy purge),
      # and "Rebuild day slides index" (the quick rebuild would clobber the
      # actively-maintained day_slides_index.html hub page).

      - name: Archive daily AI news (JST)
        run: |
          python tools/archive_daily_ai_news.py || true

      - name: Normalize archive JSON
        run: |
          python tools/normalize_archive_json.py

      - name: Validate archive data
        run: |
          python tools/validate_archive_data.py

      - name: Write version.json (cache buster)
        run: |
          mkdir -p public-pages
          echo "{\n  \"sha\": \"${GITHUB_SHA}\",\n  \"ts\": \"$(date +%Y-%m-%dT%H:%M:%S%z)\"\n}" > public-pages/version.json

      - name: Link check (lychee)
        # Report-only: external link rot must not block archiving and the
        # data commit below.
        continue-on-error: true
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --max-concurrency 8 --exclude-mail presentations/**/*.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-pages/news/*.json public-pages/news/*.html public-pages/news/archive_index.json || true
          git add public-pages/version.json presentations/advanced_intelligence_report_latest.html presentations/day_slides_index.html || true
          git add presentations/ai_ranking_interactive.html || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily archive + Daily AI News data: $(date +%F)"
            git push
          else
            echo "No changes to commit"
          fi
