name: Update presentations (detail + latest)

on:
  schedule:
    # Run after ai-news (23:50 UTC) → 00:05 UTC
    - cron: '5 0 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'news/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build detail analysis report from news+slides
        run: |
          python -m pip install -U pip
          # No extra deps required; generator uses stdlib
          python src/generators/detail_analysis_generator.py

      - name: Refresh latest aliases
        run: |
          python script/update_presentations_latest.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain presentations)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add presentations/*.html
            git commit -m "chore(presentations): refresh latest report aliases"
            git push
          else
            echo "No changes to commit"
          fi
