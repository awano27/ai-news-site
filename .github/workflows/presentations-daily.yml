name: Update presentations (latest aliases)

on:
  schedule:
    # JST 08:40 (UTC 23:40) daily
    - cron: '40 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh latest aliases
        run: |
          python script/update_presentations_latest.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain presentations)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add presentations/*.html
            git commit -m "chore(presentations): refresh latest report aliases"
            git push
          else
            echo "No changes to commit"
          fi

