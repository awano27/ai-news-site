name: Pages self-heal

# Verify content identity as well as critical URLs. A redeploy cannot repair a
# missing provider entitlement; daily quality/freshness belongs to the safety net.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: pages-self-heal
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Compare public site with latest repository publication
        id: publication
        run: |
          REPORT_DATE=$(python -c "import json; print(json.load(open('daily-news/data.json'))['date'])")
          QUALITY_FLAG=()
          if python -c "import json,sys; sys.exit(json.load(open('daily-news/data.json')).get('quality',{}).get('status') != 'passed')"; then
            QUALITY_FLAG+=(--require-quality)
          fi
          if python scripts/check_daily_publication.py --root . --base-url https://visionhub.jp --date "$REPORT_DATE" --check-urls "${QUALITY_FLAG[@]}"; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Public content differs from repository or a critical URL failed."
          fi
      - name: Plan bounded recovery
        if: steps.publication.outputs.healthy != 'true'
        id: recovery
        run: python scripts/daily_recovery.py --kind pages --plan
      - name: Reserve this attempt before dispatch
        if: steps.recovery.outputs.dispatch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.recovery.outputs.reservation_name }}
          path: daily-recovery-state/reservation.json
          if-no-files-found: error
          retention-days: 3
      - name: Dispatch bounded recovery
        if: steps.recovery.outputs.dispatch == 'true'
        run: python scripts/daily_recovery.py --kind pages --dispatch
