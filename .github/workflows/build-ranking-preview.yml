name: Build ranking preview (formal HTML)

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'presentations/ai_ranking_input_latest.txt'
  schedule:
    # 23:30 UTC = 08:30 JST — runs after daily-news cloud (06:00 JST) + local override (08:00 JST)
    - cron: '30 23 * * *'

permissions:
  contents: write

concurrency:
  group: repo-push
  cancel-in-progress: false

jobs:
  build:
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      generated_ref: ${{ steps.commit.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Regenerate ranking input from last 30 days of news archives
        run: |
          python scripts/generate_ranking_input.py
      - name: Build ranking report from preview input
        run: |
          python script/build_ranking_from_preview.py
      - name: Commit & push HTML
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/ai_ranking_input_latest.txt presentations/ai_ranking_report_*.html presentations/ai_ranking_report_latest.html
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "build(ranking): formal HTML from preview input"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/publish-generated-content.yml
    with:
      ref: ${{ needs.build.outputs.generated_ref }}
    permissions:
      contents: read
      pages: write
      id-token: write
