name: Build ranking preview (formal HTML)

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'presentations/ai_ranking_input_latest.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Build ranking report from preview input
        run: |
          python script/build_ranking_from_preview.py
      - name: Commit & push HTML
        run: |
          if [ -n " M presentations/day_slides/day_slide_2025_08_30.html" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add presentations/ai_ranking_report_*.html presentations/ai_ranking_report_latest.html
            git commit -m "build(ranking): formal HTML from preview input"
            git push
          else
            echo "No changes"
          fi
