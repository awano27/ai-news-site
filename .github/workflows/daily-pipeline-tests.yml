name: Daily publication offline tests

on:
  push:
    branches: [main]
    paths:
      - 'requirements-daily.txt'
      - 'config/editorial_recovery_*.json'
      - 'src/auto_collect/**'
      - 'tools/archive_daily_ai_news.py'
      - 'presentations/recommended_tools/index.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'requirements-daily.txt'
      - 'config/editorial_recovery_*.json'
      - 'src/auto_collect/**'
      - 'tools/archive_daily_ai_news.py'
      - 'presentations/recommended_tools/index.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install offline test dependencies
        run: python -m pip install pytest PyYAML Pillow requests feedparser beautifulsoup4 jinja2 python-dateutil
      - name: Run deterministic publication regressions
        run: |
          python -m pytest -q \
            tests/test_legacy_news_nonempty.py \
            tests/test_editorial_recovery.py \
            tests/test_llm_shared_cooldown.py \
            tests/test_tool_catalog_integrity.py \
            tests/test_daily_quality.py \
            tests/test_daily_source_freshness.py \
            tests/test_daily_override_entrypoints.py \
            tests/test_daily_report_transport.py \
            tests/test_auto_collect_main.py \
            tests/test_build_search_index.py \
            tests/test_sync_daily_search.py \
            tests/test_daily_publication.py \
            tests/test_daily_workflows.py \
            tests/test_publish_daily_report.py \
            tests/test_finalize_daily_search.py \
            tests/test_build_homepage_latest.py \
            tests/test_homepage_claim_evidence.py \
            tests/test_homepage_oct9_regressions.py \
            tests/test_homepage_preserves_same_day_news.py \
            tests/test_homepage_week_titles.py \
            tests/test_search_coverage_labels.py
