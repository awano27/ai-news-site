name: Auto Daily Report — Cloud Primary

# Primary scheduled attempt at 06:00 JST. GitHub cron can be delayed/skipped;
# a schedule is not a 07:00 publication guarantee. Quality/configuration failures
# remain failures and preserve the previous publication. A successful completion
# explicitly triggers Pages via workflow_run, including GITHUB_TOKEN commits.
# Local authorized overrides may later add private-vault X bookmarks.

on:
  schedule:
    # JST 06:00 = UTC 21:00 (previous day)
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-push
  cancel-in-progress: false

jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-daily.txt
          pip install -e .

      - name: Run pipeline (NVIDIA NIM)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          NVIDIA_PRODUCTION_USE_CONFIRMED: ${{ vars.NVIDIA_PRODUCTION_USE_CONFIRMED }}
        run: |
          python -m src.auto_collect.main --provider nvidia --force

      - name: Link and verify daily publication before commit
        run: |
          python scripts/sync_daily_search.py --root .
          node scripts/build-homepage-latest.js
          python scripts/check_daily_publication.py --root . --date "$(date +%F)" --require-quality

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REPORT_DATE="$(date +%F)"
          python scripts/publish_daily_report.py \
            --repo . \
            --date "$REPORT_DATE" \
            --require-quality \
            --message "chore(report): cloud primary run $REPORT_DATE" \
            --push

      - name: Warn if local override missing for 2+ days
        # Detects silent failure of the local 08:00 JST override (X bookmarks)
        # by checking that at least one "local override" commit landed in the
        # last 2 days. Surfaces a workflow warning in the Actions UI.
        if: always()
        run: |
          recent=$(git log --since="2 days ago" --grep="local override" --oneline | wc -l)
          if [ "$recent" -eq 0 ]; then
            echo "::warning::No 'local override' commit in the last 2 days — X bookmarks may be missing on visionhub.jp/daily-news/. Check Windows Task Scheduler 'visionhub-daily-news-override' on the user's PC."
          else
            echo "Local override healthy: $recent commit(s) in last 2 days"
          fi

      - name: Retain failure diagnostics without secrets
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/auto_collect/daily_quality_*.json
            logs/auto_collect/daily_candidate_*.json
          if-no-files-found: warn
          retention-days: 7

