name: Auto Daily Report — Cloud Primary

# Cloud-primary: this workflow ALWAYS produces the day's report, so the
# public site has fresh content every morning regardless of the user's PC
# state. The local Ollama run (src/auto_collect/run_daily.sh) is the
# secondary path — when the PC is on, it pulls Cloud's commit, regenerates
# with the local LLM (which also includes X bookmarks from the Obsidian
# vault), and pushes the override. Result:
#
#   06:30 JST   Cloud commit lands → site shows fresh report (no X tab)
#   ~08:00 JST  PC up → local run overrides → X tab fills in
#
# Outputs (one pipeline → many files):
#   - presentations/auto_daily_report.html   (Top 15 curated)
#   - daily-news/index.html                  (full timeline; X tab empty here)
#
# X bookmarks live in C:/develop/obsidian/2026/00 Inbox/X-Bookmarks/ on the
# user's PC and are not exposed to GitHub Actions (vault is private). The
# local override fills the X tab once the PC catches up.

on:
  schedule:
    # JST 06:00 = UTC 21:00 (previous day)
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  primary:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (NVIDIA NIM)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python -m src.auto_collect.main --provider nvidia --force

      - name: Commit & push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes after cloud run; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add input/day/*.txt presentations/auto_daily_report.html presentations/auto_daily_report.json presentations/daily_reports/ public-pages/api/auto_daily_report/ public-pages/news/ daily-news/ 2>/dev/null || true
          git add -A presentations/ input/ public-pages/ daily-news/ 2>/dev/null || true
          git commit -m "chore(report): cloud primary run $(date +%F)"
          git push

      - name: Warn if local override missing for 2+ days
        # Detects silent failure of the local 08:00 JST override (X bookmarks)
        # by checking that at least one "local override" commit landed in the
        # last 2 days. Surfaces a workflow warning in the Actions UI.
        if: always()
        run: |
          recent=$(git log --since="2 days ago" --grep="local override" --oneline | wc -l)
          if [ "$recent" -eq 0 ]; then
            echo "::warning::No 'local override' commit in the last 2 days — X bookmarks may be missing on visionhub.jp/daily-news/. Check Windows Task Scheduler 'visionhub-daily-news-override' on the user's PC."
          else
            echo "Local override healthy: $recent commit(s) in last 2 days"
          fi
