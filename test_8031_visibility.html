<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>8/31 Slide Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    </style>
</head>
<body>
    <h1>8/31 Slide Visibility Test</h1>
    
    <div id="test-result" class="test-result">
        <p>Testing slide accessibility...</p>
    </div>
    
    <p><a href="presentations/day_slides/day_slide_2025_08_31.html" target="_blank">→ Open 8/31 Slide</a></p>
    
    <script>
        // Simple test to check if slide exists
        fetch('presentations/day_slides/day_slide_2025_08_31.html')
            .then(response => {
                const resultDiv = document.getElementById('test-result');
                if (response.ok) {
                    resultDiv.className = 'test-result success';
                    resultDiv.innerHTML = '<strong>✅ Success!</strong> 8/31 slide is accessible and loading correctly.';
                } else {
                    resultDiv.className = 'test-result error';
                    resultDiv.innerHTML = '<strong>❌ Error!</strong> 8/31 slide returned status: ' + response.status;
                }
            })
            .catch(error => {
                const resultDiv = document.getElementById('test-result');
                resultDiv.className = 'test-result error';
                resultDiv.innerHTML = '<strong>❌ Error!</strong> Failed to fetch slide: ' + error.message;
            });
    </script>
</body>
</html>
