# GitHub Pages Jekyll Configuration
title: AI News Intelligence Platform
description: Daily AI News Analysis and Ranking System
url: "https://awano27.github.io"
baseurl: "/ai-news-site"

# Build settings
markdown: kramdown
highlighter: rouge
theme: jekyll-theme-primer

# Exclude from processing
exclude:
  - frontend/node_modules/
  - node_modules/
  - src/
  - .venv/
  - venv/
  - __pycache__/
  - "*.py"
  - "*.pyc"
  - "*.zip"
  - requirements*.txt
  - build*.py
  - generate*.py
  - run*.py
  - simple*.py
  - test*.py
  - logs/
  - dist/
  - .gitignore
  - CLAUDE.md
  - setup*.ps1
  - package*.json
  - tsconfig*.json
  - vite.config.ts
  - tailwind.config.js
  - postcss.config.js

# Include specific directories for GitHub Pages
include:
  - presentations/
  - input/

# Plugin settings
plugins:
  - jekyll-github-metadata
  - jekyll-seo-tag

# Collections for presentations
collections:
  presentations:
    output: true
    permalink: /:collection/:name/

# Default layout for presentations
defaults:
  - scope:
      path: "presentations"
    values:
      layout: default