<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>9/1 Links Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-link { 
            display: inline-block; 
            background: #3182ce; 
            color: white; 
            padding: 10px 20px; 
            border-radius: 25px; 
            text-decoration: none; 
            margin: 10px; 
            font-weight: 500;
            cursor: pointer;
            z-index: 9999;
            position: relative;
        }
        .test-link:hover {
            background: #2c5aa0;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <h1>9/1 AIヘルスケア「RX」- ソースリンクテスト</h1>
    
    <p>以下のリンクをテストしてください：</p>
    
    <div>
        <a href="https://x.com/aicaretoc/status/1962318286361887145" target="_blank" class="test-link">📱 X（Twitter）投稿</a>
        <a href="https://www.aicaretoc.io" target="_blank" class="test-link">🌐 公式ウェブサイト</a>
        <a href="https://medium.com/@aicaretoc/ai-caretoc-operator-labswisenet-launching-ai-platform-rx-presents-a-new-paradigm-for-the-650eda848383" target="_blank" class="test-link">📄 Medium記事</a>
        <a href="https://n.news.naver.com/article/009/0005549915" target="_blank" class="test-link">📰 Naverニュース</a>
    </div>
    
    <hr>
    
    <h2>テスト結果</h2>
    <p>上記のリンクが全て新しいタブで開けば成功です。</p>
    
    <script>
        // Enhanced link handling
        document.addEventListener('DOMContentLoaded', function() {
            const links = document.querySelectorAll('a[target="_blank"]');
            links.forEach(function(link) {
                link.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    console.log('Link clicked:', this.href);
                    // Don't prevent default - let it open naturally
                });
            });
        });
    </script>
</body>
</html>
